---
name: pypi-install

# checks whether what is already on PyPI actually works, not merely
# installs -- which no pull request asks, checking out the tree it is
# testing being the whole point of one. No checkout in the job that
# installs, on purpose: nothing from this repository takes part in it,
# which is what guarantees the checks below resolve to what was installed
# from the index and not to a source tree. wait-for-index is the one job
# that checks anything out and it installs nothing: its sparse checkout
# reaches .github/scripts, and the repository root that cone mode always
# adds with it, so there is no src/btclib_node on the runner that answers
# it either.
#
# `import btclib_node` runs __init__.py alone, and what a bare import
# cannot see is the runtime path a user actually exercises. The store
# is where the tree and the index currently disagree: this tree's own
# store is RocksDB through `rocksdict`, `src/btclib_node/db.py` being
# what depends on it, but the one release this workflow installs --
# `btclib-node` 2026.8.27 -- declares no store dependency at all, its
# own `db.py` importing the stdlib `sqlite3` instead, so no cell below
# resolves a `rocksdict` wheel. `pyproject.toml` already depends on
# `rocksdict>=0.3.29`, unreleased, so what this paragraph describes holds
# for as long as 2026.8.27 is the newest release and for no longer:
# whoever reads it against a later one measures the index again rather
# than trusting the sentence. This package unconditionally depends on
# `btclib[secp256k1]` as well, and there an import that returns settles
# nothing -- `btclib._libsecp256k1` degrades a broken pair silently to
# the Python arithmetic, tens of times slower and not constant-time,
# rather than failing on import. So the checks below ask past the
# import: that the bindings this package always pulls in actually
# serve, and that a `Node` this package's own class builds and starts
# on regtest comes back down cleanly, which is the one thing every one
# of this repository's own functional tests already exercises against
# a source tree and this workflow is the only place that exercises
# against the index.
#
# A schedule is also something GitHub itself stops firing: it suspends a
# workflow's cron trigger after sixty days without repository activity,
# and says so only by email. Sixty quiet days is exactly the stretch this
# sentinel exists to cover, so a silence from it is worth a look at the
# Actions tab before it is read as green.
on:
  schedule:
    # Wednesday, the hour after deps-latest.yml, and the pair is why this is
    # weekly: deps-latest.yml upgrades every dependency and runs the suite,
    # this asks what the index actually serves, and read together they
    # separate a break this tree caused from one that arrived. What it
    # watches is external rot -- a new interpreter, an index serving a
    # file that does not match its own hash -- which a week samples as
    # well as anything longer, and after a release the trigger below
    # answers immediately regardless.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "20 5 * * 3"
  # after a release, which is the one moment this workflow's answer can
  # change: a call does not forget, where RELEASING.md's step is a verdict
  # to read. Called by release.yml rather than triggered by
  # workflow_run, which zizmor rates a dangerous trigger and rightly -- it
  # runs the default branch's copy with the token of a push nobody reviewed
  # -- where a call runs inside the release that gated it. The caller passes
  # the tag, and only the caller does: the weekly run and a dispatch have
  # no particular version in mind, which is the point of them
  workflow_call:
    inputs:
      version:
        description: >-
          the tag whose version the index must serve before the matrix
          installs anything, empty on a run with no release behind it
        required: false
        type: string
        default: ""
  workflow_dispatch:
  # so a change to this file or to the script it runs is checked by the
  # thing it configures, the same way os-macos.yml is. closed is deliberately
  # absent, unlike that one: the concurrency block below cancels
  # nothing, this workflow's own runs each being a sample worth keeping
  # rather than one superseding another, so a closed event here would
  # supersede no run whichever group it landed in -- it would only add
  # one, installing from the index for a pull request nobody is on any
  # more
  #
  # The wait's own logic is .github/scripts/wait_for_pypi_release.py
  # rather than a loop in a run: block, and naming that script beside
  # this file is what vendored-vectors.yml does with the same shape
  # (btclib-org/.github#814). What such a run asks of the script, the tag
  # being empty on a pull request, is the plumbing
  # tests/wait_for_pypi_release_test.py cannot reach: the argv the step
  # below passes, a sparse checkout that has to hold the path it names,
  # and the standard library alone under --no-project, where the test
  # loads the script into a venv carrying this project's dependencies.
  # The rejected alternative leaves the script out, so that a diff
  # touching no workflow spends no matrix; what it costs is a script-only
  # pull request landing without this workflow having run the changed
  # script, the first run nobody asks for being the weekly schedule or
  # the next release. What naming it spends is runner time and not a
  # merge: REPOSITORY.md's required checks on main do not name this
  # workflow
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/pypi-install.yml
      - .github/scripts/wait_for_pypi_release.py

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies) can read the token, so it must not be able to
# write to the repository
permissions:
  contents: read

# never cancel a sentinel: a scheduled run and a dispatched one are both
# samples worth keeping, and neither supersedes the other. A concurrent
# run queues instead
concurrency:
  group: pypi-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # one question about the index, asked once, ahead of every cell that
  # would otherwise ask it. What the wait decides when it runs out is a
  # verdict no trigger can produce -- what is waited on is somebody
  # else's upload, so neither a release nor a rehearsal can arrange for
  # it to be late -- so it is a script with a test rather than a loop in
  # a run: block, which is what section 10 of btclib-org/.github's
  # README.md asks of a wait (btclib-org/.github#641). The budget is the
  # script's own default deadline; timeout-minutes here is well above it,
  # and bounds the job rather than the wait.
  #
  # Nothing here is conditioned on the version: the input is empty
  # wherever no release is calling, and an empty tag is nothing to wait
  # for. An `if:` on it would make a tag the only thing that ever runs
  # this, and a job a release is the first to run is a job whose defect
  # ships with that release -- which has already happened to this wait,
  # in more than one repository of this organization. The draft
  # condition is the matrix job's own, for the reason given there
  wait-for-index:
    name: Wait for the index to serve the released version
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # sparse: what lands is .github/scripts plus the repository root,
      # cone mode being the default and root files always being in the
      # cone, so there is no src/btclib_node for an import to resolve
      # to. This job builds nothing and installs nothing, and the
      # --no-project below ignores the root's pyproject.toml
      - name: Check out the wait script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # --no-project, so it runs on the interpreter uv fetches and
      # installs nothing: the script takes the standard library alone,
      # which is what lets it run before anything of this project exists
      # on the runner
      - name: Wait for the index to serve the released version
        shell: bash
        env:
          TAG: ${{ inputs.version }}
        run: |
          uv run --no-project --python 3.14 \
            .github/scripts/wait_for_pypi_release.py btclib-node "$TAG"

  install-published:
    name: >-
      ${{ matrix.no-binary && 'Build' || 'Install' }}
      btclib-node from PyPI on ${{ matrix.os }}
    # a draft pull request is work in progress and spends no runner
    # here either: the same condition lint.yml and test.yml carry, and
    # ready_for_review is a trigger type above for the same reason
    if: ${{ !github.event.pull_request.draft }}
    # every cell resolves whatever the index serves when it starts, so
    # none of them starts until the wait above has returned. On every
    # trigger but a release call it returns at once, having had no
    # version to wait for
    needs: wait-for-index
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # every image one of this repository's own platform sentinels or
        # gate cells already runs, and nothing beyond it: os-ubuntu.yml's
        # own header is why aarch64 Linux is here at all -- this package
        # resolves a different published btclib_secp256k1 wheel there
        # from the one ubuntu-latest installs -- os-macos.yml's is why
        # both macOS images are here rather than one, the btclib_secp256k1
        # wheel a Darwin cell resolves being the architecture's where the
        # start method that file argues from is the platform's -- and
        # test.yml's `windows` job is why windows-latest is here: this
        # package's classifiers now name Windows too (issue #430), and
        # this workflow checks that claim against the index the way it
        # already checks the other two
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-latest
          - windows-latest
        include:
          # the one cell where the sdist is what gets built, not merely
          # what a missing wheel would silently fall back to:
          # [tool.uv.build-backend] in pyproject.toml declares this
          # sdist's contents as a set of glob patterns rather than
          # reading them off git, and a wheel built straight from a
          # working tree cannot see a pattern that dropped a module the
          # published sdist needed. No second interpreter to add this
          # to, unlike btclib's own copy of this file: os-ubuntu.yml's
          # header already settled that this tree's interpreter axis is
          # one cell wide, `requires-python` naming the newest and only
          # interpreter this package claims
          - os: ubuntu-latest
            no-binary: true
    timeout-minutes: 20
    steps:
      # every run step below declares `shell: bash`, and the matrix is why:
      # the default shell on a Windows runner is PowerShell, which parses
      # none of this. A run step went in without the line on a sibling
      # repository's own copy of this file (btclib issue #1141) and took
      # every Windows cell of a release run with it -- "Missing opening
      # '(' after keyword 'for'" -- having never run before that tag, a
      # release being then the only trigger that reached it. A step whose
      # script happens to be a couple of plain commands survives
      # PowerShell unchanged, which is what makes an omission invisible
      # on review; declaring it on every step is what makes the absence
      # of one visible instead
      # uv rather than actions/setup-python, which is what every other
      # workflow here already uses. The windows-11-arm gap the
      # setup-python action carries on a sibling repository's copy of
      # this file does not reach this matrix, windows-11-arm not being
      # one of the images above
      - name: Setup uv with Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      # --verbose so the log names the btclib_secp256k1 wheel this cell
      # resolved to, and on the include cell above where the package
      # itself is built from its sdist, what that build did too.
      # --only-binary btclib-node on every other cell: without it a
      # yanked or missing wheel demotes a cell to an sdist build
      # silently, and the run stays green while testing the wrong thing.
      # Only btclib-node is constrained either way, never its
      # dependencies: they are left to resolve however the resolver
      # normally would.
      # A venv of its own, and every step below runs --no-project
      # against it: there is no checkout, so nothing of this repository
      # is on the path either way, and that is the property the header
      # above claims
      - name: Install btclib-node from PyPI
        shell: bash
        env:
          NO_BINARY: ${{ matrix.no-binary || false }}
        run: |
          uv venv --python 3.14
          if [ "$NO_BINARY" = "true" ]; then
            uv pip install --verbose --no-binary btclib-node btclib-node
          else
            uv pip install --verbose --only-binary btclib-node btclib-node
          fi
      # is_libsecp256k1_serving is what the header above says a bare
      # import cannot see: this package names no extra of its own that
      # would make the bindings optional, unlike btclib's own two-job
      # split for this file, so there is only ever one configuration to
      # check here
      - name: Verify the bindings serve
        shell: bash
        run: |
          uv run --no-project python -c "from importlib.metadata import version; \
            from btclib.curves import is_libsecp256k1_serving; \
            print('installed version:', version('btclib-node')); \
            assert is_libsecp256k1_serving(), \
              'btclib[secp256k1] resolved, the bindings do not serve'"
      # the check tests/conftest.py's own node_context builds a Node
      # from, against the index's copy of the class rather than this
      # repository's own: a chain that resolves, a data directory that
      # gets created, both listeners bound on regtest's fixed ports and
      # closed again -- the one thing every functional test in this
      # repository already exercises against a source tree. On
      # windows-latest this passes regardless of the listener defect
      # issue #430 argues from a live run, not despite it: `P2pManager`
      # and `RpcManager` each schedule `server` on a background thread
      # through `run_coroutine_threadsafe`, and neither `node.start()`
      # nor `node.stop()` below ever reads the `concurrent.futures.Future`
      # that scheduling returns, so the `NotImplementedError`
      # `loop.add_reader` used to raise there never reached this script
      # at all -- this step's pass names nothing about whether the
      # installed release's own listener actually accepts a connection,
      # only that starting and stopping a `Node` does not raise
      - name: Verify a Node starts and stops on regtest
        shell: bash
        run: |
          uv run --no-project python -c "
          import tempfile

          from btclib_node import Node
          from btclib_node.config import Config

          with tempfile.TemporaryDirectory() as tmp:
              node = Node(config=Config(chain='regtest', data_dir=tmp, debug=True))
              node.start()
              node.stop()
          print('the node started and stopped cleanly')
          "
