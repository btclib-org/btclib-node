---
name: os-macos

# The platform the merge gate does not wait for. pyproject.toml claims
# macOS in its classifiers, and until this file nothing here ran a line
# of this package on it.
#
# That much is a small argument: a classifier is a claim about where
# this runs, and nothing here had run it there.
#
# What differs beneath the suite is how a worker process comes into
# being. `src/btclib_node/__init__.py` builds a `multiprocessing.pool.Pool`
# with no context, so it takes the platform's default start method:
#
#     uv run --locked --no-default-groups python -c \
#         'import multiprocessing as mp; print(mp.get_start_method())'
#     spawn
#
# `multiprocessing/context.py` decides that on `sys.platform` and
# `reduction.HAVE_SEND_HANDLE`, giving macOS `spawn` and a POSIX
# platform that is not macOS `forkserver`, so a worker here is an execv
# of a fresh interpreter where a worker on the gate's image is a fork of
# a preloaded template. What crosses into a worker is pickled under
# either, so pickling is not what this cell catches and nothing here is
# to be read as claiming it is.
#
# The store is a second argument, and `src/btclib_node/db.py` is where
# it is argued: RocksDB through `rocksdict`, a compiled extension, so
# each image here resolves a published wheel of it different from the
# one the gate's cell installs. `uv.lock` names wheels for `rocksdict`
# and no sdist, so a cell resolves that wheel or fails at environment
# sync, and no compiler runs here on either branch -- which is what
# makes a macOS wheel that stops being published a red run rather than a
# source build nobody asked for. The suite is what reads each Darwin
# build back across every path this tree's own store takes;
# pypi-install.yml's own macOS cells open the store and close it, which
# is a much smaller question asked of the index rather than of this
# tree.
#
# What this runs is the gate's own job on another image: the same
# interpreter, the same lock, without the coverage floor -- test.yml's
# own `ubuntu-latest` cell is where that is measured and gated, on the
# one interpreter section 8 of btclib-org/.github's README argues is
# enough for it. `--no-cov` here is this job's own argument rather
# than a second copy of that one: section 8 names it beside
# `COVERAGE_FILE` as an argument a job may carry on its own account.
# What varies here is the platform, and between the two cells below the
# architecture.
#
# It gates no commit and no merge. A macOS regression sits on main for at
# most a week, and that is the trade btclib-org/.github#85 makes for
# every row that is not one of the first four: at the organization's
# ceiling on concurrent jobs, a platform row earns a place before a
# review only if waiting for it costs less than the review does.

on:
  schedule:
    # section 10 of btclib-org/.github's README.md is the calendar, and
    # this line is not the place to restate it: one grid, in one file,
    # naming the day for the workflow and the minute for the repository.
    # Only the default branch schedules anything, so on any other branch
    # the dispatch below is the way in
    - cron: "20 5 * * 4"
  # the escape hatch: the platform on demand, for a branch that touches
  # the store, the lock, or anything a path reaches
  workflow_dispatch:
  # so a change to this file is checked by the thing it configures, the
  # same way links.yml is -- and for the same reason a schedule alone is
  # not enough here: a mistake in it would otherwise be found by the next
  # sweep rather than by the pull request that made it
  pull_request:
    # the type list every workflow here carries, for the reasons the same
    # list carries in test.yml
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/os-macos.yml

# least privilege for the GITHUB_TOKEN: everything running in a job can
# read it, and nothing here writes
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, and by the pull request's number where there is one,
# for the reason test.yml's own group gives: neither the schedule nor a
# dispatch carries pull_request context, so github.ref still groups
# either of those, and a closed pull request cannot land in their group
concurrency:
  group: os-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event.action == 'closed' && github.event.pull_request.merged) }}

jobs:
  suite-macos:
    # a draft pull request is work its author is not asking anyone to
    # read yet, and spends no runner here either. A closed one spends
    # none either: the trigger above takes that event only so the
    # concurrency group above can tell the two closes apart -- a bare
    # close still supersedes a run this ref's group is holding, while
    # a landing queues behind it instead, since nothing else here runs
    # on the commit a merge creates before the next schedule
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    # the checkout, the interpreter setup and the suite run over each
    # cell are btclib-org/.github's: reusable-os-suite.yml, called at
    # @main so a fix there reaches this tree in one landing (section 10
    # of its README.md). What stays here is the trigger, the
    # concurrency group and this job's own id, and the two lists below,
    # which are this tree's own claim about the images and the
    # interpreter it sweeps rather than a value the called workflow
    # could default (btclib-org/.github#35)
    uses: btclib-org/.github/.github/workflows/reusable-os-suite.yml@main
    with:
      runners: '["macos-26-intel", "macos-latest"]'
      python-versions: '["3.14"]'
