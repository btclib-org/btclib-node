---
name: sdist-rebuild

# the sentinel on what the attestation vouches for: the latest release's
# tag, rebuilt the way RELEASING.md's *Rebuild a release from its tag*
# rebuilds it, and `gh attestation verify` over the rebuilt sdist, which
# passes only where its digest is one the release signed.
#
# The release lookup, the checkout, the build, the normalizer and the
# verify are btclib-org/.github's reusable-sdist-rebuild.yml, called at
# @main so a fix there reaches this tree in one landing
# (btclib-org/.github#35). What stays here is the trigger, the workflow-
# level permissions, the concurrency group and the calling job's `if:`
# and `permissions:`, which the callee does not carry and says so in its
# own header. No input is named below: this tree's own build was a bare
# `uv build`, which the callee's default (`sdist-builder: uv`, running
# `uv build --sdist`) replaces -- the wheel that bare `uv build` also
# wrote was read by nothing in this file and this tree stops building
# it here. `submodules` and `python-version` are likewise left at the
# callee's own `""` defaults, this tree's checkout having named neither.
#
# The sdist alone: section 10 of btclib-org/.github's README.md makes
# the row the sdist's. A red run is an issue against this tree. It gates
# nothing and no branch rule names it

on:
  schedule:
    # section 10 of btclib-org/.github's README.md is the calendar, and
    # this line is not the place to restate it. Only the default branch
    # schedules workflows, so on any other branch this is reachable
    # through the two triggers below
    - cron: "20 3 * * 0"
  workflow_dispatch:
  # so a change to this file is checked by the thing it configures, the
  # trigger links.yml carries for itself. What the job runs besides this
  # file is the tag's own, so nothing else a pull request touches changes
  # the answer
  pull_request:
    # the type list every workflow here carries, for the reasons the same
    # list carries in test.yml
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/sdist-rebuild.yml

# least privilege for the GITHUB_TOKEN, elevated per job below
permissions:
  contents: read

# grouped by the pull request's number where there is one, for the
# reason test.yml gives beside its own group
concurrency:
  group: sdist-rebuild-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed' }}
    uses: btclib-org/.github/.github/workflows/reusable-sdist-rebuild.yml@main
    # a called workflow's own permissions: block can only downgrade, not
    # restore, what this calling job grants -- README.md section 11's
    # "the bound refuses rather than trims", measured in
    # btclib-org/.github#912 -- so every scope the callee's job asks for
    # is named here too, or the run fails before any job starts
    permissions:
      contents: read
      attestations: read
