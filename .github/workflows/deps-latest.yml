---
name: deps-latest

# the dependency sentinel: everything uv resolves, upgraded to the newest
# release that satisfies pyproject.toml, and then put through the suite,
# the lint gate and the packaging checks -- the three btclib-org/.github's
# README.md section 10 names this sentinel for.
#
# Every dependency of this project is declared as a floor rather than a
# pin, and the reason is in pyproject.toml: btclib's `main` moves under
# this tree by design, and the rest of the resolution is meant to move
# with a `pip install` a user would get today. That premise is exactly
# what nothing else checks -- every other workflow passes `--locked`, so
# what CI runs is the resolution someone locked, and a release that has
# changed an API or dropped an interpreter since then goes unnoticed
# until somebody re-locks by hand.
#
# The obvious alternative, dropping --locked from test.yml and resolving
# afresh on every run, is what this workflow exists instead of: a pull
# request would go red for a release in somebody else's repository, with
# main's required checks in front of it, and the contributor holding the
# branch cannot fix any of it. pytest runs with
# filterwarnings = ["error"] and coverage with a fail_under ratchet, so
# the ways an upstream release turns this tree red without touching it
# are not hypothetical. Determinism is what makes the gate legible; the
# early warning belongs on a schedule, off the critical path.
#
# One interpreter and one image, where btclib-benchmarks' own copy of
# this file runs the ends of an interpreter range: `.python-version`
# pins 3.14 and `requires-python` is `>=3.14`, test.yml's own header
# saying why a matrix here would be one value wide. What varies in this
# job is not the interpreter, it is which release of each dependency the
# resolver picks.
#
# Scope: what uv resolves. Not the pre-commit hook revisions, which are
# pinned in .pre-commit-config.yaml and bumped by pre-commit.ci's weekly
# pull request -- that pull request runs the merge gate, so ruff and the
# other pinned hooks already have their sentinel. mypy is the exception
# and the reason the lint job below is here at all: its hook is local and
# shells out to uv, so it is the lock that pins it.
#
# Nothing here gates anything, by construction: a separate workflow, with
# no aggregate job, named by no branch protection rule. This job is
# expected to go red for reasons no pull request introduced, and a red
# check nobody can act on from a branch is noise. It opens no issue on
# failure either, which would cost issues: write in a job that needs
# nothing but read; a failed scheduled run notifies the last person to
# have touched the cron below, and that is the signal

on:
  schedule:
    # the day before Dependabot's, which is the whole point of the
    # placement: this reports on an upgrade before the pull request
    # carrying it opens, and .github/dependabot.yml says the same from
    # its own side. Which day that is, and the time, are section 10's
    # grid in btclib-org/.github and not this file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "20 4 * * 3"
  # the escape hatch: worth reaching for on a branch that moves a floor
  # in pyproject.toml, which is the one edit whose effect this workflow
  # is the only thing that measures
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, btclib's own source build) can read the token,
# so it must not be able to write to the repository
permissions:
  contents: read

# named literally rather than with github.workflow: nothing calls this
# workflow, but that expression is the caller's name when something does,
# and the convention is what keeps the groups distinct
concurrency:
  group: deps-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-latest:
    name: Run the suite, dependencies at latest
    runs-on: ubuntu-latest
    # far above what a run of the suite needs, the resolution the upgrade
    # below performs (a source build of btclib included) and it: what it
    # bounds is a hung job
    timeout-minutes: 30
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # a week where nothing moved is a full hit, and a week where
          # something did is the week this job has work to do anyway
          enable-cache: true
          python-version: "3.14"

      # --upgrade re-resolves every entry to the newest release that
      # satisfies pyproject.toml, which nothing else off a pull request
      # does -- btclib's own `main` included, since [tool.uv.sources]
      # points there rather than at a release. It prints one "Updated
      # <pkg> vA -> vB" line per package it moves, so the log names the
      # suspects without a diff of uv.lock. The same command under
      # --dry-run prints "Update" instead, so a reader checking this
      # quotation the cheap way is told the line is wrong when it is
      # right; a run that moved nothing says so, and its green means
      # nothing new. This rewrites uv.lock, harmless on an ephemeral
      # checkout and worth knowing before running the same command in a
      # working tree
      - name: Upgrade every dependency to its latest release
        run: uv lock --upgrade

      # still --locked, which is not a contradiction: the step above just
      # wrote that lock, so this asserts nothing moved between the two
      # and keeps the convention that no uv command in these workflows
      # installs from a lock it has not checked.
      # no pytest argument: addopts in pyproject.toml carries the
      # coverage flags and the report format, [tool.coverage.report] the
      # floor
      - name: Run pytest
        run: uv run --locked --no-default-groups --group test pytest

  # mypy is the whole reason this job exists, and it is worth being
  # explicit about how little else differs from the lint gate: the hooks
  # pinned by rev in .pre-commit-config.yaml are the same ones a commit
  # runs, because pre-commit.ci bumps those and this cannot. What the
  # upgrade reaches is pre-commit itself and, through the local hook that
  # shells out to uv, mypy -- the tool whose new release adds a check the
  # existing code base fails, on a schedule of its own
  lint-latest:
    name: Lint and type-check, dependencies at latest
    runs-on: ubuntu-latest
    # nothing here takes minutes; a job that does is hung
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # ImageOS is set by the runner image, not by this workflow, so the
      # env context holds nothing for it and a shell is where it is read.
      # lint.yml's step of this name carries the rest of that reasoning
      - name: Identify the runner image
        id: image
        run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      # the hook environments are the slow part and the upgrade below
      # does not touch them, which is why they are cached here at all.
      # The key carries the runner image as well as the config hash
      # because what is cached is virtualenvs: on the config hash alone
      # an ubuntu-latest rotation is not a graceful miss but a hit,
      # handing the job environments built on the previous image. This is
      # the job that can least afford one -- it runs to report what a new
      # release breaks, so a failure the cache caused is read as the
      # thing this workflow was watching for and chased in the tree
      # instead.
      # That is the key lint.yml uses, deliberately rather than by
      # coincidence, and
      #   git grep -n 'pre-commit-\${{' -- .github/workflows/
      # is what re-reads the two together: they are meant to agree
      - name: Cache the pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-${{ runner.os }}-${{ steps.image.outputs.os }}-${{
            hashFiles('.pre-commit-config.yaml', '.python-version') }}
          # a prefix that still names the image, so a partial restore
          # cannot cross an image boundary either
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ steps.image.outputs.os }}-

      - name: Upgrade every dependency to its latest release
        run: uv lock --upgrade

      # --all-files, so pre-commit does not stash the rewritten uv.lock:
      # it stashes unstaged changes only when it was given neither
      # --all-files nor --files, and a stash here would hand the mypy
      # hook back the committed lock and quietly type check the pinned
      # mypy, which is the one thing this job is for
      - name: Run every hook
        run: >-
          uv run --locked --only-group lint
          pre-commit run --all-files --show-diff-on-failure

  # the check group, and the only run of it against an upgraded lock.
  # These steps are --locked too, keeping the convention suite-latest
  # states above -- no uv command in these workflows installs from a
  # lock it has not checked -- so what differs is which lock and not the
  # flag: the step above has just rewritten this one, where test.yml's
  # dist job, the group's other consumer, runs twine,
  # check-wheel-contents and pyroma against the committed lock and so at
  # the releases uv.lock pins.
  # A pyroma that scores this metadata below the --min 10 ratchet, or a
  # twine that refuses metadata this project publishes, is otherwise met
  # on the tag that consumes the version rather than on a schedule.
  #
  # Narrower than test.yml's dist deliberately. What that job does and
  # this one does not is produce the files release.yml's publish jobs
  # download -- the build timestamp pin, the sdist normalizer, the bill
  # of materials, the checksums and the two uploads -- which a run that
  # commits nothing and publishes nothing has no consumer for; and its
  # wheel smoke-test, which installs into a fresh venv with no lock in
  # play, so the resolution that step reads is already the newest
  # releases on every pull request that reaches it -- dist is gated on
  # the pull request being neither a draft nor closed and on `changes`
  # answering that code moved, so a prose-only one does not run it
  #
  # check-sdist, the fourth member of the group, is not a step of this
  # job either: it is a pre-commit hook pinned by rev, which the upgrade
  # above does not reach, and lint-latest already runs it at that rev.
  dist-latest:
    name: Build the distribution and inspect it, dependencies at latest
    runs-on: ubuntu-latest
    # a build and three inspections of what it wrote; a job that takes
    # minutes is hung
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Upgrade every dependency to its latest release
        run: uv lock --upgrade

      # uv build builds the sdist first and then the wheel from it, not
      # both from the source tree, so the three steps below read what a
      # user installing from source would get
      - name: Build the distribution files
        run: uv build

      - name: Check the metadata and the long description
        run: uv run --locked --only-group check twine check --strict dist/*

      - name: Check the wheel contents
        run: uv run --locked --only-group check check-wheel-contents dist/*.whl

      - name: Rate the packaging metadata
        run: uv run --locked --only-group check pyroma --min 10 dist/*.tar.gz
