---
name: lint

# the gate this repository did not have. Issue #33 records that
# .github/workflows held one file, the review workflow, and that its
# branch protection therefore waits on nothing; this is that issue's
# first step and no more of it.
#
# The checkout, the uv setup, the runner-image step, the hook cache and
# the pre-commit run are btclib-org/.github's: reusable-lint.yml, called
# at @main so a fix there reaches this tree in one landing (section 10 of
# its README.md). What runs is still `.pre-commit-config.yaml` itself
# rather than a second list of tools and versions to keep in step, the
# called job checking this tree out before it runs pre-commit against
# it: CI therefore enforces exactly what a local run of it enforces,
# every hook included, and no hook is gated by pre-commit.ci alone
# (btclib-org/.github#35).
#
# It exists now because the mypy hook stopped being one pre-commit.ci
# can run. That hook shells out to uv, which is absent there, so it is
# named in the `ci:` skip list -- and until this file, a skipped hook
# was a hook nothing ran at all.

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition in reusable-lint.yml withheld while it was a draft:
    # the default types do not include it. closed joins them so that a run
    # still held in this pull request's own concurrency group is superseded
    # rather than left to finish on a branch nobody will look at again
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # allows release.yml to reuse this gate, so a tag push cannot publish
  # code the pre-commit hooks would reject
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and release.yml is the only
          caller that passes one. See the group below.
        type: string
        default: ""
  # the escape hatch, for a branch whose pull request is not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job can
# read it, and nothing here writes
permissions:
  contents: read

# cancel superseded runs: the subject is the commit, which a newer one
# supersedes. Named literally rather than through github.workflow, which
# in a called workflow is the caller's name -- release.yml calls both
# this and test.yml, and with that expression the two would share a
# group and cancel each other. By the pull request's own number rather
# than by github.ref, which for a closed, merged pull request resolves
# to the base branch's ref and would put that run in the push trigger's
# group. The suffix is what keeps a release call out of the branch
# groups: see test.yml's own concurrency block for the fuller reasoning,
# which applies here unchanged
concurrency:
  group: >-
    lint-${{ github.event.pull_request.number || github.ref
    }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  # the draft and closed declines, the checkout, the uv setup, the hook
  # cache and the pre-commit run are the called workflow's own, reading
  # github.event.pull_request.draft and github.event.action off this
  # caller's trigger. This tree checks out no submodule -- forbid-submodules
  # is one of its own hooks -- and needs no history beyond the tip, so
  # `submodules` and `fetch-depth` are left at their defaults
  lint:
    uses: btclib-org/.github/.github/workflows/reusable-lint.yml@main
