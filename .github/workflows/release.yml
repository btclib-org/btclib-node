---
name: release

# one pipeline, two targets:
# - pushing a v<version> tag runs the test and lint workflows, builds and
#   checks the distribution files, publishes them to PyPI, and turns the
#   tag into a GitHub release whose notes come from RELEASE_NOTES.md
# - workflow_dispatch is the rehearsal: the same pipeline from any
#   branch, publishing to TestPyPI under a unique .dev<N> version. A
#   rehearsal is never tagged
# Both indices trust this workflow directly (PyPI Trusted Publishing,
# see RELEASING.md): there is no API token to store or leak.
#
# The `docs:` job below runs the same build docs.yml gates a pull
# request with, so a tag publishes the docstrings a reader follows into
# docs/ only after that build has passed on the tag's own tree, not
# merely on whichever commit last ran it on `main`. It is named in
# publish-testpypi's and publish-pypi's own `needs:` for that reason.
#
# What else this does not call, unlike a sibling repository's own
# release.yml: os-macos.yml, this tree's only platform sentinel, gates
# no commit and no merge today (its own header has why -- a platform row
# earns a place before a review only where waiting for it costs less
# than the review does), and a release is not carved out as the one
# place that changes. There is no os-ubuntu.yml or os-windows.yml here
# either, test.yml's own header naming what each would ask that this
# tree does not already ask elsewhere. integration-bitcoind.yml exists
# and is a required check on every pull request, so the ancestry check
# below -- the tag has to be merged into the default branch -- is what
# already carries its answer for the tree being released.
# There is no ReadTheDocs project connected yet either -- REPOSITORY.md's
# "No Pages, and no Read the Docs project connected" -- so there is no
# sentinel here waiting on one the way bitcoin-core-rpc's `documented`
# job does; that job is what connecting one would add.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# never two runs of this workflow at once, and never a cancellation: the
# other workflows cancel a superseded run because their subject is the
# commit, and a newer commit supersedes the answer. Here the subject is a
# publication -- a version on an index, an attestation, a release -- so a
# second run is a second attempt at the same side effects, and cancelling
# one halfway is how a version reaches PyPI with no release cut for it.
# Named literally, as everywhere else: github.workflow in a called
# workflow is the caller's name, and this one calls several --
# `grep -n 'uses: \./\.github/workflows' .github/workflows/release.yml`
# is which, in the tree that is asking, rather than a number here that
# the next reusable workflow added below makes wrong
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # what a version cannot survive being wrong about, checked before
  # anything is built and long before anything is uploaded: a version is
  # consumed by the upload that carries it, and can then only be yanked.
  # A minute of checking, ahead of an hour of building.
  # The rehearsal runs this too, so a mismatch cannot wait for release day
  # to surface; only the tag comparison is release-only, there being no
  # tag to compare against otherwise
  version-check:
    name: Check the declared versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version-suffix: ${{ steps.suffix.outputs.version-suffix }}
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these
      # run in a job that can read the workflow token. It matters most in
      # this workflow, where a job holds an OIDC token PyPI accepts
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the whole history, where every other checkout in these
          # workflows takes the default single commit: the ancestry check
          # below has nothing to answer with otherwise, and it is also
          # what puts origin/<default branch> in this checkout at all
          fetch-depth: 0
      # a tag is a name that can point anywhere, and nothing else in this
      # workflow asks where: every check below reads the tree the tag
      # names rather than where that tree came from. So a tag pushed from
      # a stale worktree, or from a branch whose pull request is still
      # open, or from a commit squashed away on its way into the default
      # branch, would publish code no review ever approved and no branch
      # contains. `git merge-base --is-ancestor` is the whole of the
      # question. Release-only, like the two checks below and for the
      # same reason: a rehearsal is dispatched from a branch on purpose,
      # that being what it is for.
      - name: Check that the tag is merged into the default branch (release only)
        if: github.event_name == 'push'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH" >/dev/null; then
            msg="fetch-depth: 0 on the checkout above is what puts it there"
            echo "::error::origin/$DEFAULT_BRANCH is not in this checkout; $msg"
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"; then
            msg="a release is tagged on a commit that branch contains"
            echo "::error::$commit is not an ancestor of $DEFAULT_BRANCH; $msg"
            exit 1
          fi
          echo "$commit is an ancestor of $DEFAULT_BRANCH"
      # caching off in this job, unlike every other in these workflows: a
      # cache entry is written by whichever run populated it, and read
      # here through the scoping that gives a tag push the caches of the
      # default branch. This is the workflow whose jobs hold an OIDC
      # token PyPI accepts, so this one downloads its dependencies afresh
      # every time. It costs seconds, once per release.
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      # every other uv command in these workflows passes --locked, which
      # asserts the same thing, so this is the named early gate rather
      # than the only one
      - name: Check that uv.lock is up to date
        run: uv lock --check
      # one comparison: pyproject.toml is the only place the version is
      # declared, and uv.lock carries the project version too, which is
      # what the check above covers
      - name: Check that the tag matches the declared version (release only)
        if: github.event_name == 'push'
        run: |
          version=$(uv version --short)
          echo "pyproject.toml declares $version"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the declared version $version"
            exit 1
          fi
          # the trigger decides the index, so a tagged pre-release goes to
          # PyPI itself. RELEASING.md sends a trial run to TestPyPI
          # through workflow_dispatch and says never to tag one; this is
          # the check for it. Digits and dots only, and nothing PEP 440
          # reads as a pre-release, a dev build or a post release
          if ! echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            msg="rehearse on TestPyPI via workflow_dispatch instead"
            echo "::error::$version is not a final version; $msg"
            exit 1
          fi
          # three components at least: the day is not optional on
          # anything this pushes to PyPI, only on the placeholder "Open
          # the next cycle" sets between releases -- which is never
          # tagged, so this check never sees it
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            msg="a release is YYYY.M.D, optionally YYYY.M.D.N for a patch"
            echo "::error::$version has no day; $msg"
            exit 1
          fi
      # the release notes are RELEASE_NOTES.md's section for the tag,
      # lifted by the github-release job below, and its fallback fires
      # only on an *empty* section: a forgotten retitle publishes the
      # work-in-progress text as the release notes, silently. This is the
      # check for it, and it belongs here rather than in github-release
      # because that job runs after PyPI has accepted the files, and a
      # version cannot be unpublished.
      # CHANGELOG.md is checked too: RELEASING.md retitles the two
      # together, RELEASE_NOTES.md's section points at CHANGELOG.md's for
      # the detail, and a heading left as "work in progress" makes that a
      # link into nothing
      - name: Check that the release notes are retitled for the tag (release only)
        if: github.event_name == 'push'
        run: |
          version=$(uv version --short)
          for file in RELEASE_NOTES.md CHANGELOG.md; do
            awk -v tag="v$version" -v file="$file" '
              $0 == "## " tag {heading = NR; next}
              index($0, "## " tag " ") == 1 {heading = NR; extra = $0; next}
              /^## / && heading {exit}
              heading && NF {body = 1}
              END {
                if (!heading) {
                  printf "::error::%s has no \"## %s\" section\n", file, tag
                  exit 1
                }
                if (extra) {
                  printf "::error::%s:%d is \"%s\"; the heading must be \"## %s\" alone\n",
                    file, heading, extra, tag
                  exit 1
                }
                if (!body) {
                  printf "::error::%s section \"## %s\" is empty\n", file, tag
                  exit 1
                }
                printf "%s has a non-empty \"## %s\" section\n", file, tag
              }
            ' "$file"
          done
      # TestPyPI refuses a version it has already seen: the rehearsal
      # appends .dev<run number * 100 + attempt>, unique per dispatch and
      # per re-run of one, and sorted before the release it rehearses
      # (PEP 440). Computed here rather than inside test.yml's `dist`
      # job: every job this workflow dispatches during one run has to
      # agree on the same suffix, and this is the one job every one of
      # them already depends on, directly or through `test`
      - name: Compute the rehearsal version suffix
        id: suffix
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" -gt 99 ]; then
            echo "::error::attempt $GITHUB_RUN_ATTEMPT exceeds the two digits reserved for it"
            exit 1
          fi
          suffix=".dev$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          echo "run $GITHUB_RUN_NUMBER attempt $GITHUB_RUN_ATTEMPT: $suffix"
          echo "version-suffix=$suffix" >> "$GITHUB_OUTPUT"

  # walks the public API of the release before this one against the one
  # being cut and reports what broke: a removed object, a changed
  # parameter kind or default, a narrowed type. It runs here rather than
  # as a merge gate -- btclib-org/.github#326's own decision -- because
  # before 1.0 the surface breaks deliberately and often, and a gate
  # reporting every such break on every pull request has nothing to say
  # about which ones are allowed. Here the answer arrives while
  # RELEASE_NOTES.md is already being written, so a break with no entry
  # is refused at the moment somebody is already writing entries.
  # Ahead of the test workflow below: a broken surface is worth knowing
  # before that call's suite and dist build spend the wall clock they
  # take
  public-api:
    name: Check the public API against the last release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the previous tag has to be reachable in this checkout for the
          # step below to find it, and a single-commit checkout -- what
          # every other job's checkout takes -- would not carry it
          fetch-depth: 0
          fetch-tags: true
      # a release tag is already on the remote by the time this job runs,
      # so the "latest tag" griffe would resolve on its own is the release
      # being cut, not the one before it -- comparing a tag against itself
      # reports no break whatever changed. The previous tag is resolved
      # explicitly instead, by walking the ref's own ancestry rather than
      # a version sort, so a tag pushed on a branch this history never
      # merged is not picked up as "previous". A rehearsal has no tag of
      # its own, so it asks from HEAD directly rather than HEAD^.
      # v0.1.0 is excluded because it is not a release: it is a
      # lightweight tag on the 2023 prototype, nothing was published
      # from it and nobody installed it, so the surface it names is not
      # a promise this repository ever made. Comparing against it
      # reports the whole rewrite since as breakage, on a job both
      # publish jobs need, which would fail every release until the
      # second one. Excluded, the first release resolves no previous
      # tag and the check below skips itself; from the second on, the
      # previous tag is a release that was published
      - name: Resolve the previous release
        id: previous
        env:
          REF: >-
            ${{ github.event_name == 'push' && format('{0}^', github.ref_name)
            || 'HEAD' }}
        run: |
          if tag=$(git describe --tags --abbrev=0 --match 'v*' \
            --exclude 'v0.1.0' "$REF" 2>&1); then
            echo "previous release: $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "has-previous=true" >> "$GITHUB_OUTPUT"
          else
            echo "no previous v* tag reachable from $REF: $tag"
            echo "has-previous=false" >> "$GITHUB_OUTPUT"
          fi
      # caching off, as in version-check above: this job runs on the same
      # tag-push and workflow_dispatch triggers that job's own comment
      # gives for downloading fresh rather than trusting a cache entry
      # written by a run this one cannot vouch for
      - name: Setup uv
        if: steps.previous.outputs.has-previous == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      # griffe runs from PyPI through uvx rather than from a pyproject.toml
      # dependency group: unlike pre-commit -- pinned by uv.lock because
      # every contributor's own run has to agree with the gate's -- this
      # runs at release time only, on one maintainer's own action, so a
      # dependency group buys reproducibility nothing here needs. The
      # version pin on the line below is what still keeps this
      # comparison from answering differently on two release days for a
      # reason that has nothing to do with either release.
      # -s . -s src covers a layout this repository has moved once:
      # the working tree keeps btclib_node/ under src/, where v0.1.0
      # held it at the root. That tag is excluded above and is no
      # longer a reference this job resolves, so -s . stands against a
      # move of the same kind rather than against that one -- a search
      # path that finds nothing in a reference is skipped in favour of
      # the other, so keeping it costs nothing.
      # No base ref on a rehearsal: workflow_dispatch has no tag to check
      # a public surface at, so the comparison falls back to griffe's own
      # default, the current code
      - name: Check the public API against the previous release
        if: steps.previous.outputs.has-previous == 'true'
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          BASE_REF: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          base_args=()
          if [ -n "$BASE_REF" ]; then
            base_args=(-b "$BASE_REF")
          fi
          if ! uvx griffe==2.2.0 check btclib_node -s . -s src \
              -a "$PREVIOUS_TAG" "${base_args[@]}" -f github; then
            msg="the public API changed since $PREVIOUS_TAG:"
            echo "::error::$msg add a breaking-changes bullet to" \
              "RELEASE_NOTES.md, or say here why the change is not one"
            exit 1
          fi
      - name: Skip the check (no previous release to compare against)
        if: steps.previous.outputs.has-previous == 'false'
        run: |
          echo "::notice::no previous v* tag is reachable; nothing to" \
            "compare this release's public API against"

  # the whole test/lint gate, exactly as a pull request runs it, and the
  # distribution files besides: test.yml's `dist` job builds them, checks
  # them and uploads them, so this call is what makes them exist for the
  # publish jobs below to download.
  # REPOSITORY.md's "Token permissions" section has why this job names a
  # `permissions:` block of its own -- the `changes` job inside test.yml
  # reads a pull request's files, which contents: read does not carry
  test:
    name: Run the test workflow
    needs: version-check
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test.yml
    with:
      # what keeps this run out of the branch concurrency groups: see the
      # group in test.yml
      concurrency-suffix: "-release"
      # empty on the tag path, where the step above is skipped and a
      # skipped step's output is the empty string: a release ships the
      # version the tree declares
      version-suffix: ${{ needs.version-check.outputs.version-suffix }}
      # only this call sets it too: this is the run whose dist job builds
      # what a tag or a rehearsal actually publishes, so its Setup uv
      # step must not trust a cache another run wrote
      disable-dist-cache: true

  # and the same checks a pull request lints with: without this, a tag
  # push could publish code the pre-commit hooks reject. Not gated on
  # version-check: this is the cheap one, and it runs in parallel with it
  lint:
    name: Run the lint workflow
    uses: ./.github/workflows/lint.yml
    with:
      concurrency-suffix: "-release"

  # the same build docs.yml gates a pull request with -- this file's own
  # header comment, at the top, has why it is named in the two `needs:`
  # below. Not gated on version-check, for the same reason lint above is
  # not: it is the cheap one, and runs in parallel with it
  docs:
    name: Run the docs workflow
    uses: ./.github/workflows/docs.yml
    with:
      concurrency-suffix: "-release"

  publish-testpypi:
    name: Publish to TestPyPI
    # public-api stays a need for ordering -- reading a broken surface
    # before spending the platform sweeps' wall clock is the point,
    # public-api's own comment says so -- but not for its result: that
    # job's own comment calls it deliberately not a merge gate, and
    # `needs` without `always()` gates on every listed job regardless, a
    # skipped or failed job counting the same as one that never ran.
    # btclib-org/btclib#1461 is where this exact shape blocked
    # publish-testpypi from ever starting, on the first cycle to run
    # public-api against a real breaking change
    needs: [public-api, test, lint, docs]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.repository == 'btclib-org/btclib-node' &&
      needs.test.result == 'success' && needs.lint.result == 'success' &&
      needs.docs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/btclib-node/
    permissions:
      # OIDC: this is what lets TestPyPI trust the workflow itself
      id-token: write
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # generates PEP 740 attestations by default
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
      # the smoke test runs again here, without constraints, after the
      # upload rather than before: installing a dependency executes its
      # code, and a compromised one must not reach a dist/ still to be
      # handed on. test.yml's own smoke test installs the wheel this job
      # just uploaded, --no-deps and metadata-only for the reason beside
      # it (issue #381: PyPI's own btclib does not satisfy this tree's
      # floor yet); this one resolves the real dependency graph from the
      # index, which is why it is not run there -- it will fail exactly
      # as a real install would until #381 closes, and closing #381 is
      # what makes this step meaningful rather than what makes it exist
      - name: Install from TestPyPI and use it
        run: |
          # read off the wheel this job just published rather than
          # redeclared: neither this job nor the download step above
          # ever checked pyproject.toml out, and the wheel's own name is
          # {distribution}-{version}-... regardless
          wheel=$(basename dist/*.whl)
          version=$(echo "$wheel" | cut -d- -f2)
          uv run --isolated --no-project \
            --index https://test.pypi.org/simple/ \
            --index-strategy unsafe-best-match \
            --with "btclib-node==$version" \
            python -c "from btclib_node import Node; print(Node)"

  publish-pypi:
    name: Publish to PyPI
    # See publish-testpypi's own comment: public-api stays a need for
    # ordering, not for its result, the same issue applying to a tag
    # push as to a rehearsal
    needs: [public-api, test, lint, docs]
    if: >-
      always() && github.event_name == 'push' &&
      github.repository == 'btclib-org/btclib-node' &&
      needs.test.result == 'success' && needs.lint.result == 'success' &&
      needs.docs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # deployment gate: configure required reviewers on the "pypi"
    # environment to require a manual approval before publishing
    environment:
      name: pypi
      url: https://pypi.org/project/btclib-node/
    permissions:
      # OIDC: this is what lets PyPI trust the workflow itself
      id-token: write
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # generates PEP 740 attestations by default
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      # the same reason as the TestPyPI job's own step above: this
      # asserts against the index rather than against a wheel this job
      # already trusted. A scheduled sentinel that asks the same
      # question on its own cadence is left to btclib-org/btclib-node#287
      - name: Install from PyPI and use it
        run: |
          wheel=$(basename dist/*.whl)
          version=$(echo "$wheel" | cut -d- -f2)
          uv run --isolated --no-project --with "btclib-node==$version" \
            python -c "from btclib_node import Node; print(Node)"

  # the same files reach users by two routes and only one of them carried
  # provenance: the publish action above generates PEP 740 attestations
  # for the copies on the index, while the copies attached to the GitHub
  # release below carry nothing. This job signs them, and the digests are
  # the index's own, the dist artifact being downloaded here rather than
  # rebuilt.
  # After a publish and not after the build, so that a run reaching here
  # is a run the environment approval already let through
  attest:
    name: Attest the distribution files
    needs: [publish-pypi, publish-testpypi]
    # always(), the other publish job being skipped rather than run, and
    # a skipped job is one `needs` treats as failed
    if: >-
      always() && (needs.publish-pypi.result == 'success' ||
      needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # OIDC for the short-lived Sigstore signing certificate, and the
      # write that persists the attestation against the repository
      id-token: write
      attestations: write
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Download the bill of materials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist/
      # actions/attest and not the attest-build-provenance wrapper around
      # it: as of v4 the wrapper is a composite that does nothing but
      # call this, and its own README sends new callers here.
      # One attestation, all three files: the statement carries every
      # subject the glob matched, so verifying the wheel, the sdist or
      # the bill of materials against the bundle below works
      - name: Attest the distribution files
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Collect the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" attestation.jsonl
      - name: Upload the attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation
          path: attestation.jsonl

  # only after PyPI has accepted the files: a GitHub release announces
  # what users can already install. See bitcoin-core-rpc's RELEASING.md
  # for the failure modes always() and the two .result checks below are
  # written against -- publish-testpypi being skipped on a tag push is
  # what would otherwise skip this job through attest as well
  github-release:
    name: Attach the files to the GitHub release
    needs: [publish-pypi, attest]
    if: >-
      always() && needs.publish-pypi.result == 'success' &&
      needs.attest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # the one job that writes to the repository through its token, and
      # what it writes is a release; the attestation the job above
      # signed went to the attestations API under a permission of its own
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Download the bill of materials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist/
      # into a directory of its own, so that the dist/* glob below stays
      # the distribution files and nothing else
      - name: Download the attestation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation
          path: attestation/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # the release notes are the tag's own section of
        # RELEASE_NOTES.md; if the section is missing the release still
        # happens, with notes generated from the merged pull requests
        # instead. The fallback is the safety net for a tag pushed past
        # a red version-check, not the check itself
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "( |$)" {found=1; next}
            /^## / && found {exit}
            found {print}
          ' RELEASE_NOTES.md > "$RUNNER_TEMP/notes.md"
          # named for the tag only here, where the ref is one: nothing
          # inside the bundle says which release it belongs to, the way
          # the distribution files' own names do
          bundle="$GITHUB_REF_NAME.attestation.jsonl"
          cp attestation/attestation.jsonl "$bundle"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* "$bundle" \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "::warning::RELEASE_NOTES.md has no $GITHUB_REF_NAME section"
            gh release create "$GITHUB_REF_NAME" dist/* "$bundle" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
