---
name: release

# one pipeline, two targets:
# - pushing a v<version> tag runs the test and lint workflows, builds and
#   checks the distribution files, publishes them to PyPI, and turns the
#   tag into a GitHub release whose notes come from RELEASE_NOTES.md
# - workflow_dispatch is the rehearsal: the same pipeline from any
#   branch, publishing to TestPyPI under a unique .dev<N> version. A
#   rehearsal is never tagged
# Both indices trust this workflow directly (PyPI Trusted Publishing,
# see RELEASING.md): there is no API token to store or leak.
#
# The `docs:` job below runs the same build docs.yml gates a pull
# request with, so a tag publishes the docstrings a reader follows into
# docs/ only after that build has passed on the tag's own tree, not
# merely on whichever commit last ran it on `main`. It is named in
# publish-testpypi's and publish-pypi's own `needs:` for that reason.
#
# What else this does not call, unlike a sibling repository's own
# release.yml: the two platform sentinels beside the test workflow --
# os-macos.yml and os-ubuntu.yml -- gate no commit and no merge today
# (os-macos.yml's header has why: a platform row earns a place before a
# review only where waiting for it costs less than the review does;
# test.yml's own header says what each sentinel adds and what its own
# windows-latest cell adds instead, issue #430), and a release is not
# carved out as the one place that changes. integration-bitcoind.yml
# exists and is a required check on every pull request, so the ancestry
# check below -- the tag has to be merged into the default branch -- is
# what already carries its answer for the tree being released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# never two runs of this workflow at once, and never a cancellation: the
# other workflows cancel a superseded run because their subject is the
# commit, and a newer commit supersedes the answer. Here the subject is a
# publication -- a version on an index, an attestation, a release -- so a
# second run is a second attempt at the same side effects, and cancelling
# one halfway is how a version reaches PyPI with no release cut for it.
# Named literally, as everywhere else: github.workflow in a called
# workflow is the caller's name, and this one calls several --
# `grep -n 'uses: \./\.github/workflows' .github/workflows/release.yml`
# is which, in the tree that is asking, rather than a number here that
# the next reusable workflow added below makes wrong
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # what a version cannot survive being wrong about, checked before
  # anything is built and long before anything is uploaded: a version is
  # consumed by the upload that carries it, and can then only be yanked.
  # A minute of checking, ahead of an hour of building.
  # The rehearsal runs this too, so a mismatch cannot wait for release day
  # to surface; only the tag comparison is release-only, there being no
  # tag to compare against otherwise.
  # The checkout, the ancestry check, the lock check, the version and
  # retitling comparisons and the rehearsal suffix are btclib-org/.github's:
  # reusable-version-check.yml, called at @main so a fix there reaches
  # this tree in one landing (section 10 of its README.md). What stays
  # here is the `needs:` edge test and documented below place on this
  # job's id, which the call keeps unchanged (btclib-org/.github#35). This
  # tree is calendar-versioned, so tag-requires-day is left at its
  # default of true rather than passed explicitly
  version-check:
    uses: btclib-org/.github/.github/workflows/reusable-version-check.yml@main

  # walks the public API of the release before this one against the one
  # being cut and reports what broke: a removed object, a changed
  # parameter kind or default, a narrowed type. It runs here rather than
  # as a merge gate -- btclib-org/.github#326's own decision -- because
  # before 1.0 the surface breaks deliberately and often, and a gate
  # reporting every such break on every pull request has nothing to say
  # about which ones are allowed. Here the answer arrives while
  # RELEASE_NOTES.md is already being written, so a break with no entry
  # is refused at the moment somebody is already writing entries.
  # It carries no `needs:`, so it starts when the run starts, beside the
  # lint and docs calls; the test call waits on version-check and starts
  # after it. Nothing in the graph orders this job against that one
  # either way. What its place in the graph orders is the other end: the
  # two publish jobs below name it, so no upload happens before the
  # surface has been read.
  # The checkout, the previous-tag resolution and the griffe comparison
  # are btclib-org/.github's: reusable-public-api.yml, called at @main so
  # a fix there reaches this tree in one landing (section 10 of its
  # README.md). What stays here is the package name; the --exclude
  # 'v0.1.0' this job used to pass to git describe excluded a tag no
  # longer in the candidate set (btclib-org/.github#105,
  # btclib-org/btclib-node#553) and the called workflow does not carry it
  # (btclib-org/.github#35)
  public-api:
    uses: btclib-org/.github/.github/workflows/reusable-public-api.yml@main
    with:
      package: btclib_node

  # the whole test/lint gate, exactly as a pull request runs it, and the
  # distribution files besides: test.yml's `dist` job builds them, checks
  # them and uploads them, so this call is what makes them exist for the
  # publish jobs below to download.
  # REPOSITORY.md's "Token permissions" section has why this job names a
  # `permissions:` block of its own -- the `changes` job inside test.yml
  # reads a pull request's files, which contents: read does not carry
  test:
    name: Run the test workflow
    needs: version-check
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test.yml # zizmor: ignore[self-repository]
    with:
      # what keeps this run out of the branch concurrency groups: see the
      # group in test.yml
      concurrency-suffix: "-release"
      # empty on the tag path, where the step above is skipped and a
      # skipped step's output is the empty string: a release ships the
      # version the tree declares
      version-suffix: ${{ needs.version-check.outputs.version-suffix }}
      # only this call sets it too: this is the run whose dist job builds
      # what a tag or a rehearsal actually publishes, so its Setup uv
      # step must not trust a cache another run wrote
      disable-dist-cache: true

  # and the same checks a pull request lints with: without this, a tag
  # push could publish code the pre-commit hooks reject. Not gated on
  # version-check: this is the cheap one, and it runs in parallel with it
  lint:
    name: Run the lint workflow
    uses: ./.github/workflows/lint.yml # zizmor: ignore[self-repository]
    with:
      concurrency-suffix: "-release"

  # the same build docs.yml gates a pull request with -- this file's own
  # header comment, at the top, has why it is named in the two `needs:`
  # below. Not gated on version-check, for the same reason lint above is
  # not: it is the cheap one, and runs in parallel with it
  docs:
    name: Run the docs workflow
    uses: ./.github/workflows/docs.yml # zizmor: ignore[self-repository]
    with:
      concurrency-suffix: "-release"

  publish-testpypi:
    name: Publish to TestPyPI
    # public-api stays a need for ordering -- this entry is what holds
    # the upload until the surface has been read, public-api's own
    # comment says so -- but not for its result: that
    # job's own comment calls it deliberately not a merge gate, and
    # `needs` without `always()` gates on every listed job regardless, a
    # skipped or failed job counting the same as one that never ran.
    # btclib-org/btclib#1461 is where this exact shape blocked
    # publish-testpypi from ever starting, on the first cycle to run
    # public-api against a real breaking change
    needs: [public-api, test, lint, docs]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.repository == 'btclib-org/btclib-node' &&
      needs.test.result == 'success' && needs.lint.result == 'success' &&
      needs.docs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/btclib-node/
    permissions:
      # OIDC: this is what lets TestPyPI trust the workflow itself
      id-token: write
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # generates PEP 740 attestations by default
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
      # No install-verify step here, matching every other repository
      # that publishes: pypi-install.yml, below the pypi-install job past
      # publish-pypi, reads pypi.org and has nothing to say about
      # test.pypi.org, a rehearsal being a check on the publish step
      # itself rather than on what the index then serves

  publish-pypi:
    name: Publish to PyPI
    # See publish-testpypi's own comment: public-api stays a need for
    # ordering, not for its result, the same issue applying to a tag
    # push as to a rehearsal
    needs: [public-api, test, lint, docs]
    if: >-
      always() && github.event_name == 'push' &&
      github.repository == 'btclib-org/btclib-node' &&
      needs.test.result == 'success' && needs.lint.result == 'success' &&
      needs.docs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # deployment gate: configure required reviewers on the "pypi"
    # environment to require a manual approval before publishing
    environment:
      name: pypi
      url: https://pypi.org/project/btclib-node/
    permissions:
      # OIDC: this is what lets PyPI trust the workflow itself
      id-token: write
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # generates PEP 740 attestations by default
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # what RELEASING.md used to ask for by hand: the sentinel on what the
  # index serves, against the version this run just published. It waits
  # for the file to be served before installing, so it cannot pass by
  # testing the previous release, and it runs beside github-release
  # rather than before it -- a release announcing files that do not
  # install is worse than a release announced a minute later, but the
  # announcement is not what makes them installable
  pypi-install:
    name: Run the pypi-install workflow
    needs: publish-pypi
    # publish-pypi's own always() opts it back in past public-api's
    # designed failure, but does not carry this job with it: a bare
    # needs: here still reads back through publish-pypi's own needs:,
    # public-api two hops away skipping this job even though its one
    # listed dependency succeeded -- measured on a sibling repository's
    # own copy of this file (btclib-org/btclib#1470), where the sentinel
    # never ran on the tag that followed btclib-org/btclib#1461's own
    # fix to publish-pypi itself. Guarded against here from this job's
    # first day rather than after it recurs
    if: always() && needs.publish-pypi.result == 'success'
    uses: ./.github/workflows/pypi-install.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ github.ref_name }}

  # the same files reach users by two routes and only one of them carried
  # provenance: the publish action above generates PEP 740 attestations
  # for the copies on the index, while the copies attached to the GitHub
  # release below carry nothing. This job signs them, and the digests are
  # the index's own, the dist artifact being downloaded here rather than
  # rebuilt.
  # After a publish and not after the build, so that a run reaching here
  # is a run the environment approval already let through
  #
  # The downloads, the statement and the bundle are btclib-org/.github's:
  # reusable-attest.yml, called at @main so a fix there reaches this tree
  # in one landing (section 10 of its README.md). What stays here is the
  # `needs:`, the `if:` and the calling job's own `permissions:`, which
  # the callee does not carry and says so in its own header
  # (btclib-org/.github#35)
  attest:
    needs: [publish-pypi, publish-testpypi]
    # always(), the other publish job being skipped rather than run, and
    # a skipped job is one `needs` treats as failed
    if: >-
      always() && (needs.publish-pypi.result == 'success' ||
      needs.publish-testpypi.result == 'success')
    # a called workflow's own permissions: block can only downgrade, not
    # restore, what this calling job grants -- README.md section 11's
    # "the bound refuses rather than trims", measured in
    # btclib-org/.github#912 -- so every scope the callee's job asks for
    # is named here too, plus `contents: read`, which the callee declares
    # only at its own workflow level and this job's block would
    # otherwise drop
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: btclib-org/.github/.github/workflows/reusable-attest.yml@main
    with:
      dist-artifact: dist

  # only after PyPI has accepted the files: a GitHub release announces
  # what users can already install. See bitcoin-core-rpc's RELEASING.md
  # for the failure modes always() and the two .result checks below are
  # written against -- publish-testpypi being skipped on a tag push is
  # what would otherwise skip this job through attest as well
  #
  # The checkout, the downloads and the release creation are
  # btclib-org/.github's: reusable-github-release.yml, called at @main
  # so a fix there reaches this tree in one landing (section 10 of its
  # README.md). What stays here is the `needs:`, the `if:` and the
  # calling job's own `permissions:`, which the callee does not carry
  # and says so in its own header (btclib-org/.github#35)
  github-release:
    needs: [publish-pypi, attest]
    if: >-
      always() && needs.publish-pypi.result == 'success' &&
      needs.attest.result == 'success'
    permissions:
      # the one job that writes to the repository through its token, and
      # what it writes is a release; the attestation the job above
      # signed went to the attestations API under a permission of its own
      contents: write
    uses: btclib-org/.github/.github/workflows/reusable-github-release.yml@main
    with:
      dist-artifact: dist

  # the sentinel on the documentation, which nothing else here asks
  # about:
  # read the docs activates and builds a new release tag from an
  # automation rule of its own, and a build that never starts fails
  # nothing -- a site answering 200 serves the last build that
  # succeeded, for as long as that takes somebody to notice.
  # REPOSITORY.md's "Read the Docs, which is btclib-node.readthedocs.io"
  # records that rule and reads its effect back off the versions
  # endpoint, the rule itself being on the dashboard's side where no
  # call in this tree reaches it (issue #596).
  #
  # The `docs` job above is not this question. That job builds the
  # documentation on the runner, which is the gate every pull request
  # already runs; this one asks whether the published site has the tag.
  # A build green on the runner and a read the docs project that never
  # triggered, or triggered and failed, are indistinguishable from
  # inside a release that only asks the first (btclib-org/.github#644).
  #
  # The rendered URL and not the v3 API, which is the reverse of what
  # `pypi-install.yml`'s own wait does with PyPI's. Read the docs
  # throttles an unauthenticated caller, and documents network-level
  # blocks that may affect an automated script calling it from a cloud
  # provider or a CI environment -- which a GitHub-hosted runner is --
  # naming a token as the way past both, so asking the API from here
  # would mean storing a credential for a check that gates nothing.
  # Sourced, not observed: nothing in this tree has called that API from
  # a runner.
  #   https://docs.readthedocs.com/platform/stable/api/v3.html
  # /en/<tag>/ is served through the same CDN the site is -- `Server:
  # cloudflare` on this project's own tag -- answers 404 for a version
  # that is inactive or has no successful build, and is the URL a reader
  # follows anyway.
  # Release-only, a rehearsal never being tagged; after version-check, so
  # a tag it refuses produces one verdict and not two; and nothing needs
  # it: a late documentation build is not a reason to withhold a wheel,
  # and the fix for a red run here is a build on their side, not a moved
  # tag
  #
  # The wait itself is `.github/scripts/wait_for_readthedocs_build.py`
  # rather than a shell loop written out here, which is what gives it a
  # test: a tag is the only trigger that reaches it, so a loop kept in
  # this file is first executed on the day a release depends on it. The
  # script's budget is a deadline and not a count of attempts, and that
  # deadline is set below the reusable workflow's own timeout-minutes, so
  # the script's `::error::` runs rather than being killed inside the
  # wait it exists to report on (btclib-org/btclib#1165).
  # `tests/wait_for_readthedocs_build_test.py` is what drives the retry,
  # the deadline and the annotation.
  #
  # What the wait still cannot do is tell "still building" from "will
  # never build": /en/<tag>/ answers 404 for both, and the v3 API that
  # separates them is ruled out above for a reason that still holds. What
  # it does instead is carry the last answer read the docs gave rather
  # than discard it, so the verdict names what the URL last said and
  # where the reason for it is written, rather than only that the job
  # waited.
  #
  # The sparse checkout and the wait itself are btclib-org/.github's:
  # reusable-documented.yml, called at @main so a fix there reaches this
  # tree in one landing (section 10 of its README.md). It checks out this
  # calling repository's own tree by default, so
  # `.github/scripts/wait_for_readthedocs_build.py` and its test stay
  # here, unmoved. What stays here besides is the `needs:` edge onto
  # version-check and the `if: github.event_name == 'push'` guard, which
  # the called workflow's own header says is the caller's
  # (btclib-org/.github#35)
  documented:
    needs: version-check
    if: github.event_name == 'push'
    uses: btclib-org/.github/.github/workflows/reusable-documented.yml@main
    with:
      readthedocs-slug: btclib-node
