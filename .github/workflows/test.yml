---
name: test

# The suite, gated at the coverage floor pyproject.toml declares, on the
# one image btclib-org/.github#85 asks a merge to wait for, at `3.14`,
# the version `.python-version` pins and `requires-python` floors.
#
# A platform cell runs beside them, `windows-latest` at `3.14` alone --
# not crossed with `3.14t`, which would spend a second slot asking the
# GIL question again rather than the platform one. It gates on the
# suite passing rather than on the floor above: the floor is a claim
# about the one image this paragraph opens on, and this cell asks a
# different question -- whether the suite runs at all on a platform
# nothing here exercised before -- rather than extending that claim to
# a second image (issue #430).
#
# The organization's own design keeps a gate to one image and one
# interpreter, at the ceiling the plan puts on the organization's
# concurrent jobs, and a platform row belongs in the weekly calendar
# under that design -- `os-macos.yml`'s own header states the rule, for
# the row it keeps out of this file, and btclib-org/.github#390 tracks
# this file's own growing divergence from it, the interpreter cell
# above having opened it. Here it puts the Windows row in too: every
# cell above runs as a parallel job rather than in sequence, so each
# one's cost is one more job at the ceiling and no extra wait, against a
# review that takes longer than any of them does regardless -- and for
# this row specifically, a platform with no history here has no
# regressions yet, only defects, which a week's sentinel wait would
# leave unnoticed for a week rather than caught at the pull request
# that introduced them (issue #430).
#
# `3.14t`, that same interpreter's free-threaded build, runs beside it
# in the `free-threaded` job below but does not gate. Issue #387 put
# this row in the merge gate rather than a weekly sentinel, on
# `os-macos.yml`'s own rule for a platform row -- a place in the gate
# only where waiting for it costs less than the review does -- because
# two cells running as parallel jobs cost one more slot at the ceiling
# and no extra wait. That rule cannot be evaluated once the row cannot
# install at all: `rocksdict`, this tree's own store since issue #641,
# has never published a `cp314t` wheel or an sdist, on any of its
# releases (issue #723), so `uv run` on the free-threaded interpreter
# fails at environment sync, before a single test collects -- a wait
# with no bound to compare against a review, rather than a short one.
# Building `rocksdict` from its own repository instead was considered
# and rejected: it is a Rust crate over `rust-rocksdb`/`librocksdb-sys`,
# which compiles RocksDB's own C++ source, so this job would need a
# Rust toolchain and a full native RocksDB build, from nothing, on
# every run, to keep one report-only cell green -- the opposite of the
# wheel-only design `db.py`'s own docstring argues for this dependency.
# The pin does not move for any of this: `3.14t` was never a second
# interpreter the package claims to support, it is the one it already
# claims, run a second time with the GIL off, and whether this tree's
# own code passes the suite that way was answered once already, at the
# same 100% floor, in issue #387's own comment -- worth asking again
# the day the row can install, which is when `free-threaded` can
# rejoin `test-passed`'s own `needs:` below. That sentence used to
# name issue #723's own closing as the moment, which it was not:
# #723 was closed by taking this cell *out* of `needs:` (PR #727),
# the row still does not install, and a rejoining tied to an issue
# already closed is a promise this file cannot keep (issue #747).
# Until it does install, the cell stays a job of this file, run on
# every pull request, rather than a weekly sentinel of its own,
# because what decides that in section 10 of btclib-org/.github's
# README is the clock and not the trigger: a job that fails at
# environment sync is over in seconds, where the ten minutes of
# exploration `fuzz.yml`'s own header declines to spend on a pull
# request are the sentinel's own work -- and the day the row installs
# again, it is this job, already on every pull request, that says so.
#
# **It says so without reddening the run.** A workflow run's own
# conclusion aggregates every job in it, `needs:` or not, so this
# cell's expected failure concluded each push to `main` `failure`
# while the gate was green -- and that saturation is how issue #737's
# red `windows-latest` went unreported through eight consecutive
# pushes, a second red reason changing nothing a reader could see. The
# job's steps below branch on the sync instead: the two known states
# are quiet, and the two that are news -- an installed wheel that
# hands the GIL back, and a suite that genuinely fails free-threaded --
# fail the job and colour the run (issue #747, issue #746).
#
# What the design puts beside this file is a platform sentinel each for
# what stays out of the gate: `os-macos.yml` runs this suite on Darwin,
# and `os-ubuntu.yml` on aarch64 Linux beside the image this job uses.
# Each header says what its own image adds. Windows had a third,
# `os-windows.yml`, whose runs priced the cell above before it existed;
# that cell now runs what the sentinel ran, so the sentinel is gone
# rather than kept beside a gate cell duplicating it (issue #430).

on:
  push:
    # main only: a branch with an open pull request would otherwise run
    # this twice, once per event, and the pull_request run is the one to
    # keep -- it tests the merge commit, and it is the only run a fork's
    # pull request produces. main keeps a trigger of its own because a
    # merge creates a commit no pull request tested
    branches: [main]
    # a commit that only edits prose would otherwise run the suite. The
    # changes job below asks the same question on the pull_request side,
    # where this list must not be repeated: "test: every job passed" is
    # the name main's protection requires, and a required check that
    # produces no run at all blocks the merge instead of passing it.
    # What that job exempts is exempt here: the root prose, and the
    # detect-secrets baseline, which is a lint hook's input and nothing
    # the suite reads. The two are not the same expression and do not
    # have to be -- this one is broader by a lowercase root `.md`, which
    # the job's `^[A-Z][A-Z_]*\.md$` does not exempt. The containment
    # runs one way only: every file that job exempts is exempt here too,
    # so no pull request is skipped here that a push would have tested.
    # What the gap costs is the other side of it -- a lowercase root
    # `.md` landing on main gets no run afterwards, having changed
    # nothing the suite reads
    paths-ignore:
      - "*.md"
      - ".secrets.*baseline"
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it. closed joins them so that a run still held
    # in this pull request's own concurrency group is superseded by the
    # landing rather than left to finish on a branch nobody will look at
    # again -- the same reasoning, and the same list, as lint.yml
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # allows release.yml to reuse the whole build/test pipeline, so a tag
  # or a rehearsal runs the identical suite and dist build rather than a
  # second copy of either
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and release.yml is the only
          caller that passes one. See the group below.
        type: string
        default: ""
      version-suffix:
        description: >
          Appended to the version in pyproject.toml before the `dist`
          job builds anything, by the dev-version composite action --
          this is what lets that job's own build be the one a rehearsal
          publishes, rather than a second build checked separately. A
          release passes nothing and ships the version the tree
          declares; a rehearsal passes a .dev suffix, which is how it
          reaches TestPyPI with a version that index has not already
          consumed.
        type: string
        default: ""
      disable-dist-cache:
        description: >
          Whether the `dist` job's own Setup uv step fetches its
          dependencies afresh instead of from cache. Only release.yml's
          call sets this: a cache entry written by one run is read by
          another through GitHub's branch/PR cache scoping, so the job
          whose output actually reaches an index -- a tag's upload or a
          rehearsal's TestPyPI one, both routed through this same call --
          is the one build that must not risk a poisoned cache reaching
          the wheel it ships. An ordinary pull request or push to main
          builds a copy this job throws away, so caching it is harmless,
          and a flat `enable-cache: false` here would only
          cache-penalize every one of them for a property only
          release.yml's call needs.
        type: boolean
        default: false
  # the escape hatch, for a branch whose pull request is not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job can
# read it, and the one job here that needs more than reading the
# repository asks for it itself
permissions:
  contents: read

# cancel superseded runs: the subject is the commit, which a newer one
# supersedes. Named literally rather than through github.workflow, which
# in a called workflow is the caller's name -- release.yml calls both
# this and lint.yml, and with that expression the two would share a
# group and cancel each other. By the pull request's own number rather
# than by github.ref, which for a closed, merged pull request resolves
# to the base branch's ref and would put that run in the push trigger's
# group. The suffix is a second, independent problem with github.ref:
# inside a called workflow that context is the caller's ref, so a
# rehearsal -- a workflow_dispatch of release.yml on a branch -- would
# otherwise compute the very group a push to that branch computes, and
# one run would cancel the other. release.yml passes a suffix of its
# own, which keeps the release path out of the branch groups
concurrency:
  group: >-
    test-${{ github.event.pull_request.number || github.ref
    }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  # the cheapest job here and the one that decides whether the expensive
  # one runs: a pull request that edits only prose changes nothing the
  # suite reads, and would otherwise spend the whole suite proving it.
  # It runs on every trigger and answers `true` on all
  # but one -- skipping itself on the pull_request path would leave the
  # coverage job reading an empty output, which is not 'true', and the
  # workflow would then skip on main as well
  changes:
    name: Decide whether the suite has anything to check
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the file list of a pull request, which contents: read does not
    # carry. A job's permissions replace the workflow's rather than
    # adding to them, so contents: read is named again here instead of
    # being inherited: without it this job holds contents: none, which
    # costs nothing today and would cost the first checkout added
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - name: Ask which files the pull request touches
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # a push to main, a release call and a dispatch run everything:
          # only a pull request has a base to be a diff against. A
          # release call's own event_name is release.yml's triggering
          # event -- push (a tag) or workflow_dispatch (a rehearsal) --
          # a called workflow reading github.event_name from the run
          # that invoked it rather than getting one of its own
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT is not a pull request: the suite runs"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$NUMBER/files" --paginate \
            --jq '.[].filename' > files.txt
          echo "files changed:"
          cat files.txt
          # the prose at the root, matched by the shape of its name
          # rather than by a list of the files that have it today: every
          # markdown file this tree keeps at the root is upper case, and
          # a list would have to be edited by whoever adds the next one.
          # Anything under a directory is not matched at all, which is
          # the cheap direction to be wrong in -- tests/_data/README.md
          # documents vendored data the suite reads, and .github's own
          # markdown is templates rather than prose the suite ignores by
          # construction. The detect-secrets baseline is a lint hook's
          # input and nothing else's.
          # An empty list is not a prose change, it is a question this
          # could not answer, so the count is checked before the pattern
          prose='^[A-Z][A-Z_]*\.md$|^\.secrets\..*baseline$'
          if [ ! -s files.txt ] || grep -qvE "$prose" files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "something the suite reads changed: the suite runs"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "prose only: the suite has nothing to check"
          fi

  coverage:
    name: Measure coverage, gated at 100%
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed'
      && needs.changes.outputs.code == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    # the suite is bounded test by test in pyproject.toml, so this bounds
    # what that cannot: a runner wedged before or between the tests, and
    # it is well above the whole of a local run
    timeout-minutes: 30
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these
      # run in a job that can read the workflow token
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the token in .git/config by default, where
          # anything running afterwards can read it and any step
          # archiving the workspace would carry it out of the job.
          # Nothing in these workflows performs an authenticated git
          # operation, so nothing needs it to stay.
          # This is the checkout the other workflows here cite: the one
          # on the gate, which runs on every pull request
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # the cache holds what uv.lock resolves, which is wheels and
          # no build: what this job spends its time on is the suite
          enable-cache: true
          # `3.14`, what .python-version pins and what a bare `uv run`
          # gives a maintainer locally. Not read from that file, because
          # the coupling belongs where the gate is: the number this job
          # fails on is a ratio of statements, and a statement count
          # moves between interpreters, so `free-threaded` below
          # measures its own copy against the same floor rather than
          # inheriting this cell's number
          python-version: "3.14"
      # no pytest argument at all: addopts in pyproject.toml carries the
      # coverage flags and the report format, [tool.coverage.report] the
      # floor, and this file is not what anybody runs locally. A second
      # copy of any of them is a copy that can disagree with the one a
      # developer sees
      - name: Run the suite under coverage
        run: >
          uv run --locked --no-default-groups --group test pytest

  # the platform cell this file's own header argues: the same suite, on
  # the platform nothing above runs it, at the one interpreter cell the
  # axis above already claims -- not crossed with `3.14t`, a second slot
  # asking the GIL question this cell is not about
  windows:
    name: Run the suite (windows-latest)
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed'
      && needs.changes.outputs.code == 'true' }}
    needs: changes
    runs-on: windows-latest
    # the same bound the coverage job above sets on the same suite: what
    # it bounds is a runner wedged before or between the tests, not the
    # work
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # the cache holds what uv.lock resolves: btclib_secp256k1 and
          # cffi both publish a wheel for this interpreter on this
          # platform, so an install failure here would be a finding of
          # its own rather than the environment
          enable-cache: true
          # `3.14` alone, for the reason this file's own header gives
          # the cell as a whole
          python-version: "3.14"
      # --no-cov, against the --cov pyproject.toml's addopts carries:
      # the floor above is a claim about one interpreter on one image,
      # and this cell asks a different question -- whether the suite
      # passes on a second platform -- so a run here that hit the floor
      # would fail for the wrong reason
      - name: Run the suite
        run: >
          uv run --locked --no-default-groups --group test pytest --no-cov

  # `3.14t`, the free-threaded build of the interpreter the job above
  # runs -- this file's own header has why it runs here and not in that
  # job's matrix, and why it is not in `test-passed`'s own `needs:`
  # below. `if` and `needs` otherwise match every other job here: a
  # report nobody waits on still has no reason to run on a draft or a
  # closed pull request
  free-threaded:
    name: Run the suite free-threaded (3.14t), report-only
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed'
      && needs.changes.outputs.code == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14t"
      # in a step of its own, and tolerated, so that the one state this
      # cell has been in since issue #723 -- no `cp314t` wheel to
      # install -- stops concluding the whole run `failure` while the
      # gate below is green. That saturation is not cosmetic: it is
      # how issue #737's own red `windows-latest` went unreported
      # through eight consecutive pushes, there being nothing left for
      # a second red reason to change (issue #747)
      - name: Can the free-threaded environment install at all?
        id: sync
        continue-on-error: true
        run: >
          uv sync --locked --no-default-groups --group test
      # a notice and not a warning: what deserves a warning is the
      # day the row installs badly, which the step below raises. One
      # line, a workflow annotation being a single line by
      # construction
      - name: Report the missing wheel rather than reddening the run
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::notice::no cp314t rocksdict wheel and no sdist: suite not run, issue #746"
      # the day the row installs, `success` here would otherwise be
      # taken for a free-threaded pass, and issue #746 measured that it
      # would not be one: rocksdict builds for `3.14t` unmodified but
      # declares a bare `#[pymodule]`, which PyO3 documents as
      # `gil_used = true` for 0.23 through 0.27, so importing it hands
      # the GIL back. `Node.worker_pool` reads `sys._is_gil_enabled()`
      # at first use, after that import, so the whole suite would run
      # the process-pool arm and report a free-threaded success it
      # never measured. `import btclib_node` is what pulls rocksdict
      # in -- `'rocksdict' in sys.modules` is `True` after it -- so
      # this is the point the question can be asked at all
      - name: Refuse a free-threaded report that got the GIL back
        if: steps.sync.outcome == 'success'
        run: |
          uv run --no-sync python -c '
          import sys
          import btclib_node
          print("imported", btclib_node.__name__, "for its rocksdict")
          print("rocksdict in sys.modules:", "rocksdict" in sys.modules)
          if sys._is_gil_enabled():
              raise SystemExit(
                  "::error::the GIL is back on this free-threaded "
                  "interpreter, so this cell measures the GIL build "
                  "rather than the free-threaded one. An extension "
                  "declared gil_used = true: see issue #746"
              )
          print("the GIL is off: this cell measures what it claims to")
          '
      # coverage stays on, matching the `coverage` job above: issue
      # #387's own measurement found no per-build difference in what
      # the floor requires, so this cell's own environment-sync failure
      # is the whole of what distinguishes it from that job today, not
      # a weaker check written around it
      - name: Run the suite under coverage
        if: steps.sync.outcome == 'success'
        run: >
          uv run --locked --no-default-groups --group test pytest

  # the packaging metadata is checked on every pull request, not only on
  # the tag that ships it: a release is the one place where finding a
  # problem is too late, a version being consumed by the upload that
  # carries it and then only yankable. This job is also what
  # release.yml's publish jobs download from: they build nothing of
  # their own, so a tag and a rehearsal both publish exactly the files
  # checked here, `version-suffix` being how a rehearsal's build carries
  # the version it publishes under
  dist:
    name: Build the distribution files, check them, install one
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed'
      && needs.changes.outputs.code == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # caching off only when release.yml calls this workflow: see
      # disable-dist-cache's own description above
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: ${{ !inputs.disable-dist-cache }}
      # what the sdist normalizer and the bill-of-materials generator
      # below read. uv_build itself ignores it and stamps a fixed
      # timestamp into both archives, so nothing in this job is
      # unreproducible without it; what the export and the two scripts
      # together buy is that the answer is this repository's rather than
      # the backend's. The commit date, not the tag's: `git log -1` on a
      # shallow clone reads the tip, which is the commit the tag points
      # at, and a lightweight tag has no date of its own to prefer
      - name: Pin the build timestamp to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      # empty on every trigger but a release rehearsal: `inputs` is unset
      # outside a workflow_call, so a direct run of this workflow --
      # a pull request or a push to main -- skips this and ships the
      # version the tree declares, same as a real release does.
      # TestPyPI refuses a version it has already seen, which is what
      # the suffix is for; release.yml's version-check job computes it
      # once and passes it down, so every job this workflow runs during
      # one dispatch agrees on it
      - name: Make the version unique for TestPyPI (rehearsal only)
        if: inputs.version-suffix != ''
        uses: ./.github/actions/dev-version
        with:
          suffix: ${{ inputs.version-suffix }}
      # uv build builds the sdist first and then the wheel from it, not
      # both from the source tree, so what is checked below is what a
      # user installing from source would get, and what a rehearsal
      # ships is built from the tree the step above just re-locked.
      # That the sdist is complete in the first place is check-sdist's
      # job, a pre-commit hook, gated by the lint workflow
      - name: Build the distribution files
        run: uv build
      # the member metadata of the sdist, rewritten to the epoch above
      # so that a rebuild of this commit answers with these bytes
      # whatever backend it runs. --no-project, so this runs on the
      # interpreter uv already fetched and installs nothing into the
      # tree it is about to publish
      - name: Make the sdist's determinism this tree's
        run: |
          uv run --no-project --python 3.14 \
            .github/scripts/normalize_sdist.py dist/
      # a CycloneDX bill of materials naming the distribution, its
      # licence and every dependency the wheel's own metadata declares
      # -- what an attestation vouches for the bytes of and says nothing
      # about the contents of. After the sdist normalizer, whose rewrite
      # changes the digest this script records into the document
      - name: Write the bill of materials
        run: |
          uv run --no-project --python 3.14 \
            .github/scripts/generate_sbom.py dist/ sbom/
      - name: Checksum the distribution files
        run: sha256sum dist/* sbom/*
      # before anything is installed, and that ordering is the point: a
      # step below runs third-party code -- twine, check-wheel-contents
      # and pyroma come from a group uv installs, and a `.pth` file in a
      # dependency executes at interpreter startup, before the first
      # import -- while dist/ is a writable directory on the same
      # runner. Uploading first freezes what release.yml's publish jobs
      # will download, so the worst a compromised dependency can do here
      # is fail this job, which stops them from ever seeing what it built
      - name: Upload the distribution files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - name: Upload the bill of materials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
      # the same validation PyPI applies on upload: broken metadata, or a
      # README that does not render, cannot be fixed by reuploading.
      # After the upload above rather than before it, for the reason
      # given there
      - name: Check the metadata and the long description
        run: uv run --locked --only-group check twine check --strict dist/*
      # what twine does not look at: where the files land once
      # installed, a test package shipped by accident, a stray top-level
      # module. [tool.check-wheel-contents]'s own `package` names
      # src/btclib_node, so this also diffs the wheel's btclib_node/
      # against this checkout's, file for file, in both directions
      - name: Check the wheel contents
        run: uv run --locked --only-group check check-wheel-contents dist/*.whl
      # and what twine cannot see either: metadata that is valid but
      # poor, a missing classifier or url, a version PyPI would sort in
      # a way nobody meant. --min 10 is a ratchet, the score being 10
      # today
      - name: Rate the packaging metadata
        run: uv run --locked --only-group check pyroma --min 10 dist/*.tar.gz
      # what none of the three above does: install the wheel, alone, from
      # an empty directory, resolving `Requires-Dist` from PyPI exactly as
      # `pip install btclib-node` would, and import `Node` from what that
      # installs. A dependency this checkout resolves through
      # [tool.uv.sources] -- btclib off its `main` branch -- is what the
      # published wheel has to declare as an ordinary floor instead, PyPI
      # refusing a direct reference in metadata; the assertions below are
      # the check for it, since nothing before `publish-pypi` in
      # release.yml otherwise reads the built wheel's own metadata rather
      # than pyproject.toml's.
      # This was `--no-deps`, metadata-only, from the day this job first
      # landed until issue #381 closed: PyPI carried no release with
      # `btclib.p2p.negotiation`, which `src/btclib_node/download.py`
      # imports unconditionally, so no floor this table could declare
      # would let an ordinary install resolve, and the fuller form below
      # would have failed on every run for a reason no floor bump here
      # could fix. #381's own "Done when" is what this step now clears.
      # After the upload too, for the reason its own comment gives:
      # installing a dependency executes its code, and a compromised one
      # must not reach a `dist/` that still has to be handed on
      - name: Smoke-test the wheel, installed on its own
        run: |
          cd "$RUNNER_TEMP"
          uv venv
          uv pip install "$GITHUB_WORKSPACE"/dist/*.whl
          .venv/bin/python -c "
          from importlib.metadata import requires, version

          from btclib_node import Node

          name = 'btclib-node'
          print(version(name), Node)
          reqs = requires(name) or []
          assert any(req.startswith('btclib') for req in reqs), reqs
          assert not any('@' in req for req in reqs), reqs
          "

  # the one name main's protection has to carry to require this
  # workflow, and it exists because such a rule names its checks as
  # literal strings, stored outside the repository: a job named there is
  # a name no pull request can review, and one that stops being produced
  # becomes a required check that never reports, which blocks every merge
  # until somebody remembers where the rule lives. This job depends on
  # the others instead, so the rule names one thing that never changes
  # and a job added here is gated on by being added.
  # It carries it: this name is a required check on main today, one of
  # four, set through classic branch protection and not through any of
  # the three rulesets -- main-integrity, main-self-merge and
  # tag-integrity hold signatures, linear history, no force push,
  # deletion and pull_request between them, and none of them a
  # required_status_checks rule. REPOSITORY.md's *Required checks on
  # main* is where that is read back off both endpoints, and is the one
  # place it is stated: no list of the four is repeated here.
  # This comment said the opposite until issue #749 -- that nothing
  # required a status check and the classic protection was empty, citing
  # btclib-org/.github#88. That was true when it was written and stopped
  # being true with nothing to notice, #88 being the issue that records
  # the state moving rather than one that holds it still
  test-passed:
    # the name and not the id is what a required-check rule matches, in
    # classic protection here and in a ruleset alike, and it carries
    # the workflow on purpose: a check is keyed by name alone, so two
    # workflows with a job named "every job passed" would produce one
    # ambiguous context. lint.yml needs no aggregate while it has one
    # job -- the job is the check there -- and the day it grows a second
    # one, this pattern and a change to the rule are what that costs
    name: "test: every job passed"
    needs: [changes, coverage, windows, dist]
    # not success(): a job whose dependencies failed is skipped, and a
    # skipped check reports "skipped", which branch protection counts as
    # satisfied. The gate has to run to be able to fail.
    # not always() either: a cancellation of this run itself -- the
    # concurrency group superseding it with a newer push -- would reach
    # this job and fail it, turning a cancellation the newer run already
    # speaks for into a red required check with no defect behind it.
    # !cancelled() lets this job be skipped there instead, which
    # satisfies the check as any other skip does, while a single needed
    # job cancelled on its own still fails below.
    # The draft and closed conditions are the ones every job above
    # carries, so that a draft skips uniformly rather than tripping this
    if: >-
      ${{ !cancelled()
      && !github.event.pull_request.draft
      && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the condition reads the whole needs context rather than naming
      # each job, so a job added to needs above is covered without
      # touching this. "skipped" is not a failure on its own: the
      # coverage job skips by design on a prose-only pull request, and
      # reading that as a defect would fail the gate the changes job
      # exists to let pass cheaply. changes itself is in needs, so its
      # failure -- and a skip that follows from one -- still arrives here
      # as "failure"
      - name: Fail unless every job above succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
