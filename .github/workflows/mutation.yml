---
name: mutation

# Coverage answers "was this line executed"; this answers "would the suite
# notice if it were wrong". What runs is what
# .github/mutation/interpreter.toml says, which is what CONTRIBUTING.md
# documents for a local run: one scope and one test command, not a second
# copy of them in yaml.
#
# The baseline check, the session loop, the restore guard, the counts and
# the upload are btclib-org/.github's reusable-mutation.yml, called at
# @main so a fix there reaches this tree in one landing (section 10 of
# that repository's README.md, btclib-org/.github#35). What stays here is
# this tree's own subject matter -- the scope
# .github/mutation/interpreter.toml states, its budget and the job's
# ceiling -- and the trigger, the schedule, the concurrency group and the
# permissions, none of which a reader of the callee could write for this
# tree.
#
# It gates nothing, and therefore does not appear in main's required
# checks, and must not -- that rule lives outside the repository and names
# its checks as literal strings.

on:
  schedule:
    # weekly, at the day and hour section 10's grid in btclib-org/.github
    # gives this workflow and the minute it gives this repository: one
    # grid, in one file, and not this line's to restate.
    # Cron runs from the default branch only, so this file gates nothing
    # until it reaches main -- elsewhere it is reachable through the
    # dispatch button below and nowhere else
    - cron: "20 5 * * 1"
  # the escape hatch, and the way to ask for these numbers now
  workflow_dispatch:
  # No pull_request trigger, unlike links.yml, which does run itself when
  # its own configuration changes. What that trigger would have caught is
  # caught cheaply elsewhere -- check-toml parses this file on every
  # commit, and `cosmic-ray baseline`, which the callee runs first, fails
  # the run before any mutant if the test command has gone stale

# least privilege for the GITHUB_TOKEN: everything running in a job can
# read it, and nothing here writes. In particular no issues: write --
# filing an issue per survivor is the obvious next step and the wrong one,
# a survivor being a test to write rather than a defect to track
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here: in a called workflow that
# expression is the caller's name.
# cancel-in-progress because a dispatch is how somebody asks for these
# numbers now, and waiting behind the scheduled run would be the opposite
# of an escape hatch
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # one profile: this tree runs one scope, so the matrix the callee loops
  # over has a single cell. The ceiling is the job's own former
  # timeout-minutes, carried over unchanged, and the session budget is the
  # `timeout --signal=INT` the former single-job step ran under
  mutation:
    uses: btclib-org/.github/.github/workflows/reusable-mutation.yml@main
    with:
      profiles: >-
        [{"profile": "the consensus entry point", "slug": "interpreter",
        "ceiling": 20, "sessions": "interpreter.toml 10m"}]
