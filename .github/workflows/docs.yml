---
name: docs

# the third gate, and a question of its own: does the documentation build.
# Without it nothing in CI builds it, only read the docs does, with -W
# -- so invalid reStructuredText in a docstring fails after the merge on
# a service whose failure is not a check on the pull request.
#
# The build itself, the checkout and the unresolved-link check are
# btclib-org/.github's: reusable-docs.yml, called at @main so a fix there
# reaches this tree in one landing (section 10 of its README.md). What
# stays here is the trigger and the concurrency group
# (btclib-org/.github#35)

on:
  push:
    # main only, for the reason lint.yml gives at the same key: a push to
    # a branch with an open pull request would run this twice, in two
    # concurrency groups that do not cancel each other for every
    # pull_request action except closed on a merge -- see that trigger's
    # own comment below -- and the pull_request run is the one worth
    # keeping
    branches: [main]
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run
    # this pull request's own concurrency group is still holding
    # survives either unless the closed event lands in that same group
    # -- which this type is what makes it do, cancel-in-progress below
    # turning the landing into the cancellation. That was meant to be
    # *this* pull request's own group and nothing else's: github.ref for
    # a closed, merged pull request resolves to the base branch's ref
    # rather than refs/pull/N/merge, so grouping by github.ref alone put
    # the closed run in the push trigger's own group instead, which
    # would cancel the run building the actual merge commit's
    # documentation moments after every merge. The concurrency block
    # below groups a pull_request run by the pull request's own number
    # instead, which cannot equal any push's github.ref under any action
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # allows release.yml to reuse this gate, so a tag push cannot publish
  # a version whose documentation does not build
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and release.yml is the only
          caller that passes one. See the group below.
        type: string
        default: ""
  # the escape hatch: a run on demand for a branch whose pull request is
  # not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies) can read the token, so it must not be able to
# write to the repository. The called job needs no elevation of its own,
# reusable-docs.yml's own header naming the same contents: read
permissions:
  contents: read

# cancel superseded runs on the same branch/PR.
# github.event.pull_request.number, not github.ref alone, is what a
# pull_request run of any action groups by, so a closed run cannot
# resolve to the same group as a push to main -- the pull_request
# trigger's own comment above has the reasoning. A push carries no
# pull_request context, so github.ref is still what groups it, unchanged.
# The suffix is what keeps a release call out of the branch groups: see
# test.yml's own concurrency block for the fuller reasoning
concurrency:
  group: >-
    docs-${{ github.event.pull_request.number || github.ref
    }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  # the checkout, the uv setup, the build and the unresolved-link check
  # are btclib-org/.github's; the draft and closed declines are the
  # called workflow's own, reading github.event.pull_request.draft and
  # github.event.action off this caller's trigger. This tree has no git
  # submodule for the checkout to initialize and no script of its own to
  # run against the built pages, so both inputs are left at their
  # defaults
  docs:
    uses: btclib-org/.github/.github/workflows/reusable-docs.yml@main
