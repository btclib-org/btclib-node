---
name: integration-bitcoind

# The one claim the rest of the suite cannot make. Every other p2p test
# connects one `Node` to another -- `download_test.py`'s own bootstrap
# peers included -- which is `btclib`'s p2p implementation talking to
# itself, and says nothing about it meeting a Bitcoin Core it did not
# write. `tests/integration/bitcoind_test.py` asks that question: a
# disposable regtest bitcoind, a handful of blocks, and a fresh node
# connected to it over p2p, its tip checked against bitcoind's own.
# `tests/integration/backpressure_test.py` asks whether this node's own
# receive bound engages, and releases, against a daemon serving it
# megabyte blocks faster than it validates them.
# `tests/integration/reorg_test.py` asks whether this node follows Core
# off a branch Core abandons, its own block index, UTXO set and mempool
# moving back together: a reorg is where a disagreement with Core is a
# chain split rather than a slow peer.
# `tests/integration/getpeerinfo_test.py` asks whether this node's
# `getpeerinfo` answers the time fields bitcoind's does, in the same types.
#
# Gated rather than run only on a schedule: connecting to bitcoind and
# reaching its tip took 0.11s measured against a local build of Bitcoin
# Core v31.1.0 on an otherwise idle machine, well inside the few seconds
# `bitcoin-core-rpc`'s own copy of this workflow spends per cell -- and
# that repository's is a required check for exactly that reason. The
# megabyte chain the second module needs costs seconds too rather than
# the minutes a wallet-mined fixture would: its blocks are built in the
# test and handed over with `submitblock`, the reasoning being that
# module's own. The third module hands its two branches over the same
# way, for a reason of its own: `submitblock` takes a branch from a
# lower height as readily as an extension, where mining a competing
# branch out of bitcoind's wallet wants `invalidateblock` or a second
# daemon. A run can still go red on an unreachable bitcoincore.org or a
# runner slow enough to miss bitcoind's own startup; that is a re-run,
# and it is the price of the question.
#
# The checkout, the node install, the test run and the report upload
# move into btclib-org/.github's reusable-integration-bitcoind.yml,
# called at @main so a fix there reaches this tree in one landing
# (section 10 of its README.md). `btclib` calls the same file. What
# stays here is the trigger, the schedule minute, the concurrency group,
# and this tree's own pinned release, digest and environment-variable
# names. `exclude-classname` is left unset: that input excludes
# HWI-classified testcases before judging skips, for `btclib`'s own
# `tests/integration`, which mixes them in; this tree's has none.
#
# A reusable workflow changes the check context a required check reports
# under -- GitHub composes it from the calling job's own id and the
# called job's `name:`, joined by " / " -- so the required check on main
# that named this job's own `name:` receives no run once this call
# lands. The called workflow's own header has why; updating the setting
# and REPOSITORY.md's record of it is this repository's own to do,
# outside this pull request and before it is relied on.
#
# A schedule too, like every other unattended question here, and it is
# not about the tree: the job below asks the same node the same question
# about a tree nothing has touched, which is what it takes to notice
# bitcoincore.org no longer serving the tarball pinned below rather than
# a pull request discovering that by accident. The organization's own
# calendar (section 10 of btclib-org/.github's README) names the day and
# the hour, and this repository's own minute with them.

on:
  push:
    branches: [main]
  schedule:
    # weekly, at the day and hour btclib-org/.github's own calendar
    # gives `integration-bitcoind` and the minute it gives
    # `btclib-node`: one grid, in one file, and not this line's to
    # restate. Cron runs from the default branch only, so this file gates
    # nothing until it reaches main -- elsewhere it is reachable through
    # the dispatch below and nowhere else.
    - cron: "20 5 * * 2"
  workflow_call:
  workflow_dispatch:
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it. closed joins them so that a run this pull
    # request's own concurrency group is still holding is superseded by
    # the landing rather than left to finish on a branch nobody will
    # look at again -- the same list `test.yml` and `lint.yml` carry.
    types: [opened, reopened, synchronize, ready_for_review, closed]
    # no `paths` filter: a candidate required check that never runs
    # blocks a merge where a skipped one satisfies it, so a filter and a
    # required check cannot both be had. Every pull request pays it,
    # documentation-only ones included.

# least privilege for the GITHUB_TOKEN: the tarball is fetched from
# bitcoincore.org, which does not know this token, and nothing here
# writes to the repository
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here: in a called workflow that
# expression is the caller's name.
# the key is the pull request's own number, not the head branch's name:
# head_ref carries no fork namespace, so two forks each pushing a
# branch of the same name compute one group and cancel each other's
# runs, which the pull request number does not repeat across. It falls
# back to ref rather than standing bare because it is set only for
# pull_request events, so a push run (ref refs/heads/main) still gets
# its own group, and a pull_request run -- closed and merged ones
# included -- never collides with a push's group the way a bare ref
# would
concurrency:
  group: >-
    integration-bitcoind-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

jobs:
  regtest:
    uses: btclib-org/.github/.github/workflows/reusable-integration-bitcoind.yml@main
    # permissions do not inherit through a call: the called workflow's
    # own job asks for contents: read alone, which the workflow-level
    # block above already grants, and this is what caps it rather than
    # trims it -- granting less than the callee asks is a startup
    # failure, not a quieter run
    permissions:
      contents: read
    with:
      # the release under test, and the sha256 of its linux tarball as
      # four independent guix builders attested it in
      # bitcoin-core/guix.sigs. Pinned rather than resolved to "latest":
      # a run that installs whatever is newest reports the day Core
      # released rather than the day this tree changed, and the version
      # that answered would then be unknowable from a green run. Raising
      # it is a commit, with the new sha read from the same place --
      # `btclib-org/btclib` and `btclib-org/bitcoin-core-rpc` pin the
      # identical release and digest for their own copies of this job
      bitcoind-version: "31.1"
      bitcoind-sha256: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
      # tests/integration/conftest.py's own two switches
      integration-env-var: BTCLIB_NODE_INTEGRATION
      bitcoind-path-env-var: BTCLIB_NODE_BITCOIND
      # exclude-classname left at its default, the empty string: this
      # tree's tests/integration carries no HWI-classified cases, so
      # nothing here is excluded before the called workflow judges skips
