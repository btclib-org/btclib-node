---
name: claude-review

# Claude reading a pull request against REVIEWING.md. The prompt, the
# credential guard, the action, the verdict check and the @claude answer
# are btclib-org/.github's reusable-claude-review.yml, called at @main so
# that a fix there reaches this tree in one landing (section 10 of its
# README.md); what stays here is the trigger, the concurrency group, the
# workflow-level permissions and this header.
#
# Not a required check, and it must not become one. What it produces is a
# review of type COMMENT, an opinion for the author to weigh; a review
# that gated a merge would make a model's judgement a branch rule.
# lint.yml, test.yml and docs.yml already run beside it on the same pull
# request and are required checks on main; this one deliberately is not,
# for the reason just given.
#
# It is one job's work on every pull request, which is not free: the
# ceiling on concurrent jobs is the organization's, and the other
# repositories' matrices compete for the same slots. REPOSITORY.md's
# *Plan-gated settings* has the command that reads the plan the limit is
# documented for. It earns the slot by being short -- it reads a diff, it
# does not build anything -- and by skipping a draft.
#
# What this tree adds to the shared review is a paragraph and the tools
# that paragraph asks for. The called workflow checks out at depth 1, so
# the reviewer holds no history, and a review of consensus code checks
# claims about what a rule looked like before the diff: extra-prompt
# below says how to reach an earlier revision and extra-allowed-tools
# grants the commands it names. The two travel together -- a paragraph
# telling a reviewer to run a command it may not run buys a refusal.
#
# The paragraph goes where the called workflow puts every caller's,
# between the verdict paragraph and the instruction not to run the gates.
# Nothing in it turns on the position, its subject being the checkout and
# the tools rather than the gates, and the alternative is a second
# insertion point in a shared prompt -- an input whose only job is to
# choose where another input goes.
#
# It names this repository and the base ref in expressions of its own
# rather than pointing at lines above it: a caller's `with:` value is
# evaluated in the caller, so the run's own event answers, and a
# paragraph pointing "above" would be pointing into a file this tree does
# not own.

on:
  pull_request:
    # the type list every `pull_request` workflow here carries but the one
    # `cancel-in-progress: false` exempts, for the reasons test.yml gives
    # at the same key
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # the on-demand half: somebody writes @claude in a comment on a pull
  # request, or on a line of its diff, and asks for something the automatic
  # pass did not answer
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# least privilege for the GITHUB_TOKEN, elevated on the calling job below
# and nowhere else
permissions:
  contents: read

# cancel superseded runs. At the workflow level rather than on the job,
# which is what one calling job holding both the review and the @claude
# answer forces: a group on that job would cover the two together, where
# the key below has to keep them apart. A workflow-level group is claimed
# when the run is created, before any job's `if` is read, so what the
# `closed` type buys does not rest on whether a job an `if` skips claims
# its own group -- unmeasurable while the switch is off, and closed
# unmeasured in btclib-org/btclib-secp256k1#593.
#
# The pull request's number keys the group only where the event is
# `pull_request`. A `pull_request_review_comment` carries
# `github.event.pull_request.number` as well -- `pull_request` is a
# required property of that event's payload and `number` a required one
# of its own -- so the number alone would put an @claude answer in the
# review's group and let the next push cancel it. Every other event falls
# back to `github.run_id`, which no two runs share, so
# cancel-in-progress is inert for a mention and one answer runs beside
# another rather than replacing it. Not the `github.ref` the other
# workflows here fall back to, whose events outside `pull_request` are a
# push, a schedule, a dispatch or a call; this is the one workflow here a
# comment triggers
concurrency:
  group: >-
    claude-review-${{ github.event_name == 'pull_request'
    && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # no `if:` of the review's on this job. The called workflow's two jobs
  # each decline the events that are not their own, so a condition lifted
  # up here would take the @claude answer out with the review.
  #
  # Permissions do not inherit through a call, and a called workflow's own
  # block can only downgrade what the caller granted: a scope its jobs
  # declare and this list omits ends the run in a `startup_failure` before
  # a step executes (btclib-org/.github#912). So the two writes are
  # granted here rather than assumed from the read-only default above.
  #
  # The credential is named rather than inherited: `secrets: inherit`
  # hands the called workflow every secret this repository can see, where
  # the one it declares is the one it needs
  claude:
    uses: btclib-org/.github/.github/workflows/reusable-claude-review.yml@main
    permissions:
      contents: read
      # what posting the review, or the answer to a mention, takes
      pull-requests: write
      # the OIDC token the action mints during its own startup
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      extra-prompt: |
        The checkout is fetch-depth 1: it holds this one commit and
        no history, so `git log` and `git diff` see nothing by
        themselves. To check a claim about what a file looked like
        at some earlier commit, read it with `gh api
        repos/${{ github.repository }}/contents/<path>?ref=<sha>`
        rather than a local git command -- that answers regardless
        of the checkout's depth. Where the check is a real range
        rather than one file's content -- `git log` or `git diff`
        against the base branch -- fetch it first: `git fetch origin
        ${{ github.event.pull_request.base.ref }}`, then read the
        range against
        `origin/${{ github.event.pull_request.base.ref }}`.
      # no leading comma: the called workflow writes the one that joins
      # this to its own list
      extra-allowed-tools: "Bash(git:*),Bash(gh issue view:*),Bash(gh api:*)"
