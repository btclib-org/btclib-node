---
name: deps-oldest

# the floor sentinel: verifying the claim a floor makes to whoever
# installs -- section 10 of btclib-org/.github calls this and
# deps-latest.yml a mirrored pair, the same suite run in the opposite
# resolution direction.
#
# The resolution, the lock it writes and the suite run over that lock are
# btclib-org/.github's: reusable-deps-oldest.yml, called at @main so a
# fix there reaches this tree in one landing (section 10 of its
# README.md). What stays here is the trigger, the concurrency group, the
# workflow-level permissions, and the one fact the called workflow asks
# a caller for rather than states itself: the interpreter, which is
# requires-python's own floor of 3.14 and not a newer pin
# (btclib-org/.github#35).
#
# What the resolution verifies at a floor is every specifier uv resolves
# from a registry: the runtime dependencies, and the [dependency-groups]
# entries the called workflow's own suite step installs, which uv calls
# direct dependencies too. A group entry declaring no lower bound at all
# has no floor to verify, and uv warns on each one it finds;
# pyproject.toml's own header over [dependency-groups] is where the
# bound every entry there carries is argued (#761).
#
# This also discharges issue #958: this job's own pytest step used to
# run with no argument, under this tree's `addopts` and its 100%
# `fail_under`, where the family passes `--no-cov` to a sentinel cell
# that runs the suite (section 10). The called workflow's own pytest
# step passes `--no-cov` unconditionally, so this caller cannot reproduce
# the departure

on:
  schedule:
    # section 10's grid in btclib-org/.github names the day and the
    # hour this tree schedules at, and this file does not restate them.
    # Only the default branch schedules workflows, so on any other
    # branch this is reachable through the dispatch below alone
    - cron: "20 3 * * 4"
  # the escape hatch: worth reaching for on a branch that moves a floor
  # in pyproject.toml, which is the one edit whose effect this workflow
  # is the only thing that measures
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies) can read the token, so it must not be able to
# write to the repository
permissions:
  contents: read

# named literally rather than with github.workflow: nothing calls this
# workflow, but that expression is the caller's name when something does,
# and the convention is what keeps the groups distinct
concurrency:
  group: deps-oldest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-oldest:
    uses: btclib-org/.github/.github/workflows/reusable-deps-oldest.yml@main
    with:
      python-version: "3.14"
