---
name: codeql

# Code scanning as a file rather than as a repository setting. GitHub's
# default setup would analyse this tree from a workflow it generates and
# does not show; here the languages, the query suite, the schedule and
# the action versions are read the way the rest of CI is read, in a diff.
#
# The two are mutually exclusive, and the collision is at the end rather
# than at the start: `init` succeeds, the database is built, and the
# upload is refused with "CodeQL analyses from advanced configurations
# cannot be processed when the default setup is enabled", so every run
# would report a failure it did not have. The setting is off here --
#
#     gh api repos/btclib-org/btclib-node/code-scanning/default-setup
#
# answers `state: not-configured` -- which is what lets this land without
# a setting being turned off first, and what turning it on would undo.
#
# What it buys on a node is the analysis nothing else here performs:
# `lint.yml` runs ruff's flake8-bandit rules over the Python, which is a
# pattern match on a single file, where these queries follow a value from
# where it enters -- a peer's message, an RPC request body -- to where it
# is used. The workflow files are the second language, and this is the
# only thing in the tree that reads them at all.

on:
  # a merge creates a commit no analysis has seen, and an alert is
  # attributed to a branch: the default branch is where code scanning
  # reports what is open, so without a run here there is no baseline for
  # anything else to be measured against
  push:
    branches: [main]
  pull_request:
    # ready_for_review and closed, the same two types test.yml and
    # lint.yml carry and for the reasons those files give: a pull
    # request marked ready gets the run the draft condition below
    # withheld, and a closed one lands in this pull request's own
    # concurrency group, so the landing cancels the run still holding it
    types: [opened, reopened, synchronize, ready_for_review, closed]
  schedule:
    # section 10 of btclib-org/.github's README.md is the calendar, and
    # this line is not the place to restate it. A weekly run is what a
    # push trigger cannot replace: a query pack is updated without
    # anybody touching this repository, so the same tree is a different
    # answer this week than last. Only the default branch schedules
    # anything, so on any other branch the dispatch below is the way in
    - cron: "20 4 * * 0"
  # the escape hatch: the analysis on demand for a branch whose pull
  # request is not open yet, which the trigger above cannot reach
  workflow_dispatch:

# The pull_request trigger is a trade in the direction opposite to the
# one this file made while the push and the schedule were the whole of
# it: two more cells on every push to a branch, against the ceiling on
# the organization's concurrent jobs that REPOSITORY.md's *Plan-gated
# settings* measures and btclib-org/.github#85 argues.
# What buys it back is that a finding arrives while the branch can still
# answer it, rather than on the commit a merge creates -- which is
# already the default branch. The OpenSSF Scorecard's SAST check reads
# the same way: btclib-org/.github#349 measured it scoring "SAST tool
# detected but not run on all commits" against a tree whose analysis
# only ever ran after the merge. Whether it credits this run where the
# merge is a squash is that issue's own open question and no part of
# the reason above.

# least privilege for the GITHUB_TOKEN, which everything running in a job
# can read. The analysis job asks for the two it needs on top of it, so
# the write is held by a job rather than by the workflow
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here. By the pull request's own
# number where there is one: github.ref for a closed, merged pull
# request resolves to the base branch's ref, so a group built from it
# alone would put that run in the push trigger's group and cancel the
# analysis of the merge commit
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # the language is in the name because it is what a failure is about:
    # one job per language, so a red check says which analysis broke
    # rather than a matrix cell to open. It also lets the two run at once
    name: Analyze ${{ matrix.language }} with CodeQL
    # the same draft and closed condition every job of test.yml carries:
    # a draft is not asking to be reviewed, and a closed pull request's
    # run exists only to cancel the one its group is holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      # where the alerts are uploaded; the one write in this workflow
      security-events: write
      contents: read
      # what the actions analysis reads: the workflow files are its
      # source, and analyze queries the run's own metadata
      actions: read
    strategy:
      # so one language's failure does not hide the other's result
      fail-fast: false
      matrix:
        # the two CodeQL supports here. The tree is Python, workflows,
        # markdown and toml, and there is no third language to add
        language: [actions, python]
    # far above what this tree's analysis takes, the way the suite is
    # bounded in test.yml: what the limit buys is that a hung job
    # releases the runner instead of holding it for six hours.
    # `gh run list --workflow=codeql.yml --limit 1` is what re-measures it
    timeout-minutes: 30
    steps:
      # every action pinned to a commit SHA with the tag in the comment:
      # a tag, let alone a branch, is a name its owner can move, and
      # these run in the one job here that can write security events
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # neither language is compiled, so the database is built from
          # the sources and there is nothing for an autobuild step to do.
          # Nothing is installed first either, which does cost something
          # here and is still the right trade: this package has
          # dependencies, so a call into btclib is a call CodeQL cannot
          # follow into, and what it still follows is every path through
          # this tree's own code -- for the price of not resolving and
          # installing the whole dependency set twice a week
          build-mode: none
          # `queries` is left unset on purpose, which is the default
          # query suite: the init action has no query-suite input, and
          # its `queries` input adds to the default rather than
          # replacing it. Said out loud because "no input" is otherwise
          # indistinguishable from "nobody decided"
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # what keeps the two languages' results apart within one
          # commit's analysis: without a distinct category the second
          # upload replaces the first rather than adding to it
          category: /language:${{ matrix.language }}

  # one context a branch rule can name, in place of job names that move:
  # the matrix above produces one per language, a set that changes the
  # day CodeQL gains a language worth adding here, and this job depends
  # on the matrix rather than on those names. A required status check
  # reports on the run a pull request has, so this name is requirable
  # only because the pull_request trigger above exists; whether main's
  # rule asks for it is REPOSITORY.md's *Required checks on main*, which
  # reads the endpoint rather than this file
  codeql-passed:
    # the name and not the id is what a ruleset matches, and it carries
    # the workflow on purpose: a check is keyed by name alone, so two
    # workflows with a job named "every job passed" would produce one
    # ambiguous context, and test.yml's aggregate is a required check
    name: "codeql: every job passed"
    needs: [analyze]
    # not success(): a job whose dependencies failed is skipped, and a
    # skipped check reports "skipped", which a ruleset counts as
    # satisfied. Not always() either: a cancellation of this run itself
    # -- the concurrency group superseding it with a newer push -- would
    # reach this job and fail it, turning a cancellation the newer run
    # already speaks for into a red check with no defect behind it. The
    # draft and closed halves are the analysis job's own condition, so a
    # draft skips uniformly rather than tripping this
    if: >-
      ${{ !cancelled()
      && !github.event.pull_request.draft
      && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the condition reads the whole needs context rather than naming
      # each job, so a language added to the matrix above is covered
      # without touching this. "skipped" is a failure here where
      # test.yml's own aggregate tolerates it: nothing in this workflow
      # is conditional on what a pull request touched, so a skip means
      # something upstream did not run
      - name: Fail unless every job above succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "* | *" skipped "*) exit 1 ;;
          esac
