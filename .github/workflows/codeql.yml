---
name: codeql

# Code scanning as a file rather than as a repository setting. GitHub's
# default setup would analyse this tree from a workflow it generates and
# does not show; here the languages, the query suite, the schedule and
# the action versions are read the way the rest of CI is read, in a diff.
#
# The two are mutually exclusive, and the collision is at the end rather
# than at the start: `init` succeeds, the database is built, and the
# upload is refused with "CodeQL analyses from advanced configurations
# cannot be processed when the default setup is enabled", so every run
# would report a failure it did not have. The setting is off here --
#
#     gh api repos/btclib-org/btclib-node/code-scanning/default-setup
#
# answers `state: not-configured` -- which is what lets this land without
# a setting being turned off first, and what turning it on would undo.
#
# What it buys on a node is the analysis nothing else here performs:
# `lint.yml` runs ruff's flake8-bandit rules over the Python, which is a
# pattern match on a single file, where these queries follow a value from
# where it enters -- a peer's message, an RPC request body -- to where it
# is used. The workflow files are the second language, and this is the
# only thing in the tree that reads them at all.

on:
  # a merge creates a commit no analysis has seen, and an alert is
  # attributed to a branch: the default branch is where code scanning
  # reports what is open, so without a run here there is no baseline for
  # anything else to be measured against
  push:
    branches: [main]
  pull_request:
    # ready_for_review and closed, the same two types test.yml and
    # lint.yml carry and for the reasons those files give: a pull
    # request marked ready gets the run the draft condition below
    # withheld, and a closed one lands in this pull request's own
    # concurrency group, so the landing cancels the run still holding it
    types: [opened, reopened, synchronize, ready_for_review, closed]
  schedule:
    # section 10 of btclib-org/.github's README.md is the calendar, and
    # this line is not the place to restate it. A weekly run is what a
    # push trigger cannot replace: a query pack is updated without
    # anybody touching this repository, so the same tree is a different
    # answer this week than last. Only the default branch schedules
    # anything, so on any other branch the dispatch below is the way in
    - cron: "20 4 * * 0"
  # the escape hatch: the analysis on demand for a branch whose pull
  # request is not open yet, which the trigger above cannot reach
  workflow_dispatch:

# The pull_request trigger is a trade in the direction opposite to the
# one this file made while the push and the schedule were the whole of
# it: two more cells on every push to a branch, against the ceiling on
# the organization's concurrent jobs that REPOSITORY.md's *Plan-gated
# settings* measures and btclib-org/.github#85 argues.
# What buys it back is that a finding arrives while the branch can still
# answer it, rather than on the commit a merge creates -- which is
# already the default branch. The OpenSSF Scorecard's SAST check reads
# the same way: btclib-org/.github#349 measured it scoring "SAST tool
# detected but not run on all commits" against a tree whose analysis
# only ever ran after the merge. Whether it credits this run where the
# merge is a squash is that issue's own open question and no part of
# the reason above.

# least privilege for the GITHUB_TOKEN, which everything running in a job
# can read. The analysis job asks for the two it needs on top of it, so
# the write is held by a job rather than by the workflow
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here. By the pull request's own
# number where there is one: github.ref for a closed, merged pull
# request resolves to the base branch's ref, so a group built from it
# alone would put that run in the push trigger's group and cancel the
# analysis of the merge commit
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # the matrix, the pins and the analysis itself are btclib-org/.github's,
  # called at @main so a fix there reaches this tree in one landing
  # (section 10 of its README.md); what stays here is the trigger, the
  # schedule, the concurrency group and the aggregate job below.
  # Permissions do not inherit through a call, so the write the analysis
  # needs is declared on this job rather than assumed from the read-only
  # default above
  analyze:
    uses: btclib-org/.github/.github/workflows/reusable-codeql.yml@main
    permissions:
      security-events: write
      contents: read
      actions: read

  # one context a branch rule can name, in place of job names that move:
  # the called workflow's own matrix produces one row per language, a set
  # that changes the day CodeQL gains a language worth adding there, and
  # this job depends on the calling job above rather than on those names.
  # A required status check reports on the run a pull request has, so
  # this name is requirable only because the pull_request trigger above
  # exists; whether main's rule asks for it is REPOSITORY.md's *Required
  # checks on main*, which reads the endpoint rather than this file
  codeql-passed:
    # the name and not the id is what a ruleset matches, and it carries
    # the workflow on purpose: a check is keyed by name alone, so two
    # workflows with a job named "every job passed" would produce one
    # ambiguous context, and test.yml's aggregate is a required check
    name: "codeql: every job passed"
    # ordering, and nothing else: nothing in this tree calls this
    # workflow (btclib-org/.github#982), so the step below reads the
    # run's own job listing rather than `needs.*.result`, and `needs`
    # here only sequences this job after the call above -- a language the
    # called workflow's own matrix adds is covered without touching this
    needs: [analyze]
    # not success(): a job whose dependencies failed is skipped, and a
    # skipped check reports "skipped", which a ruleset counts as
    # satisfied. Not always() either: a cancellation of this run itself
    # -- the concurrency group superseding it with a newer push -- would
    # reach this job and fail it, turning a cancellation the newer run
    # already speaks for into a red check with no defect behind it. The
    # draft and closed halves are the called workflow's own analyze job
    # condition, so a draft skips uniformly rather than tripping this
    if: >-
      ${{ !cancelled()
      && !github.event.pull_request.draft
      && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # what asking the API for this run's own jobs takes, the same read
      # test.yml's aggregate would hold for the same question if it ever
      # needed it. REPOSITORY.md's "Token permissions" is where the
      # elevation is read back
      actions: read
    steps:
      # `needs.analyze.result` cannot tell a matrix cell that died in
      # *Set up job* from one that ran and passed (btclib-org/btclib#1001);
      # asking the run's own listing instead reads what actually happened,
      # at the price of a step per workflow rather than one shared with
      # test.yml's aggregate, `needs` reaching nothing outside its own
      # workflow
      #
      # under the call above, the listing carries the called workflow's
      # rows under a name this job's own prefixes -- reusable-codeql.yml's
      # own header has the reason -- and the filter below reads `.jobs[]`
      # whole and judges each row on its conclusion column alone, so the
      # rename changes what a row is called and nothing the filter or the
      # count below reads
      #
      # the allowlist below names "success" and "skipped", both names,
      # whatever the jobs of this workflow can report today. The called
      # workflow's own analyze job carries no condition narrower than
      # this job's own draft/closed one above and no job here is
      # conditional on what a pull request touched, so no legitimate
      # "skipped" row is reachable -- which is a condition rather than a
      # property, and a job added later re-opens it. Letting the
      # allowlist follow the jobs is the alternative section 10 of the
      # organization standard rejects: the narrowing is sound the day it
      # is written, and what it costs is an expiry nothing watches. What
      # reports an allowlist that has stopped matching the run is this
      # job going red on the first run that legitimately skips, with no
      # defect under it and nothing in the tree pointing here
      # (btclib-org/.github#990)
      - name: Fail unless every other job of this run succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `.status` beside the conclusion so that an unfinished job says
          # which kind it is: queued and running are one word to
          # `.conclusion` and two facts to a reader of the log
          jobs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | "\(.conclusion // "unfinished")\t\(.status)\t\(.name)"')
          # printed before it is judged: the job whose purpose is to be
          # trusted is the one that has to be able to say what it saw
          printf '%s\n' "${jobs}"
          # awk and not grep: a tab in a grep pattern is one
          # implementation's extension and a literal "t" in another's,
          # where awk's field separator is POSIX
          bad=$(printf '%s\n' "${jobs}" |
            awk -F'\t' '$1 != "success" && $1 != "skipped" && $1 != "unfinished"')
          unfinished=$(printf '%s\n' "${jobs}" |
            awk -F'\t' '$1 == "unfinished"' | wc -l | tr -d ' ')
          # each annotation names the rows it is about, an annotation
          # being what the checks page shows without the log being
          # opened. `%0A` is a newline to one, and the tab goes with it:
          # the columns line up in a log and not in this
          annotate() {
            printf '::error::%s' "$1"
            printf '%s' "$2" | tr '\t' ' ' | awk '{ printf "%%0A%s", $0 }'
            printf '\n'
          }
          verdict=0
          if [ -n "${bad}" ]; then
            annotate "these jobs of the run did not succeed:" "${bad}"
            verdict=1
          fi
          # exactly one job of the run may be unfinished, and it is this
          # one. Counted rather than excluded by name, a name being what
          # goes stale when this job is renamed -- and none unfinished at
          # all is refused too, a listing with no job running not being a
          # listing of the run this step is running in
          if [ "${unfinished}" -ne 1 ]; then
            annotate \
              "this check should be the run's one unfinished job; ${unfinished} are" \
              "$(printf '%s\n' "${jobs}" | awk -F'\t' '$1 == "unfinished"')"
            verdict=1
          fi
          exit "${verdict}"
