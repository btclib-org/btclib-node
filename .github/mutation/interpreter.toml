# The consensus entry point, mutated: src/btclib_node/interpreter.py is
# where a block's transactions are checked, and ARCHITECTURE.md's own
# *Validation* section names it as what validates. Nothing bigger is in
# scope yet -- this is a first profile, and a second is a toml beside
# this one, not a rewrite of it.

[cosmic-ray]
module-path = "src/btclib_node/interpreter.py"

# The session budget mutation.yml sets is wide against what a session
# takes: a budget a slower runner can reach cuts the session at
# `timeout`, and a mutant it never reached has no verdict at all rather
# than a wrong one.
#
# What survives, and why, read off the `interpreter-survivors.txt`
# the workflow uploads, at run 35167687979. The `|` of `get_flags`'
# `bytes | None` parameter annotation takes every other binary
# operator cosmic-ray substitutes and nothing notices: this module
# asks for no `from __future__ import annotations` and `requires-python`
# is `>=3.14`, so an annotation is deferred and the mutated expression
# is never evaluated. Every `|` of the `STANDARD_FLAGS` union takes
# `^`, the terms of that chain being disjoint bits, which leaves the
# two operators the same function on it. Neither is a test to write,
# a mutant computing what the original computes having nothing to
# assert against. `check_transactions`' `len(x[0]) != len(x[1].vin)`
# as `is not` is an equivalence too, small-int identity answering
# there as `!=` does on every length the suite tries. As `<` it was
# the gap that run found: every test reaching the line passed fewer
# prevouts than inputs, and none passed more, until
# `test_a_prevout_count_that_exceeds_the_inputs_is_also_refused` gave
# it one (btclib-org/btclib-node#986). That mutant is caught now.
test-command = """python -m pytest -x -q -n0 --no-cov \
  tests/unit/interpreter_test.py"""

# The per-mutant ceiling is wide against the unmutated command: a
# timeout is reported as KILLED by Cosmic Ray, so a tight bound turns
# runner load into a false kill.
timeout = 60

excluded-modules = []

[cosmic-ray.distributor]
name = "local"
