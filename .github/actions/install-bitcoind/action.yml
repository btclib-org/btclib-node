---
# `integration-bitcoind.yml` is the one workflow here that needs a real
# `bitcoind`, and a composite action is the one thing GitHub Actions
# offers to keep the download, the checksum and the unpacking in one
# place rather than duplicated into every job that starts one -- there
# is only the one job today, but the version and the digest belong here
# regardless of how many callers there turn out to be, the same way
# `btclib-org/btclib` and `btclib-org/bitcoin-core-rpc` each keep their
# own copy of this file rather than inlining it into their workflow.
#
# Referenced by path (`uses: ./.github/actions/install-bitcoind`) and not
# by commit SHA, which is the rule for every third-party action: this one
# is the repository's own file, read from the same commit as the workflow
# that calls it, so there is no owner who could move it.
name: Install bitcoind
description: >-
  Download a pinned Bitcoin Core release, check its published sha256 and
  answer with the path of the daemon.

inputs:
  version:
    description: 'The release to download, "31.1" rather than "v31.1"'
    required: true
  sha256:
    description: The sha256 of that release's x86_64 linux tarball
    required: true

# an output rather than a line appended to GITHUB_ENV: a workflow that
# would write into every later step's environment is a wider blast radius
# for a value this action computes from caller-given input than an
# output the caller opts into reading
outputs:
  path:
    description: The path of the bitcoind this installed
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    # the release tarball rather than a package or a third-party action:
    # the runner's own package archive carries no bitcoind, and a Marketplace
    # action would be a fourth party between this job and a binary whose
    # checksum is already published. --fail so an HTML error page is not
    # unpacked as a tarball, and the checksum runs before the unpacking,
    # not after
    - name: Install bitcoind
      id: install
      shell: bash
      # through the environment rather than interpolated into the script:
      # an input is caller-controlled text, and `${{ }}` pasted into a run
      # body is read by the shell before it sees a line of the script
      env:
        BITCOIND_VERSION: ${{ inputs.version }}
        BITCOIND_SHA256: ${{ inputs.sha256 }}
      run: |
        base="https://bitcoincore.org/bin/bitcoin-core-$BITCOIND_VERSION"
        tarball="bitcoin-$BITCOIND_VERSION-x86_64-linux-gnu.tar.gz"
        curl --proto '=https' --proto-redir '=https' \
          --fail --silent --show-error --location --retry 3 \
          --output "$tarball" "$base/$tarball"
        echo "$BITCOIND_SHA256  $tarball" | sha256sum --check --strict
        # the daemon alone: the tarball also carries bitcoin-cli, the
        # wallet tool and the GUI's own libraries, none of which the
        # regtest job this action serves ever calls
        tar -xzf "$tarball" "bitcoin-$BITCOIND_VERSION/bin/bitcoind"
        daemon="$PWD/bitcoin-$BITCOIND_VERSION/bin/bitcoind"
        echo "path=$daemon" >> "$GITHUB_OUTPUT"
        # what answered, in the log of the run that used it: a green run
        # whose node version is only in this workflow's own yaml is one
        # nobody can date, and the version string carries the build the
        # sha256 above pinned
        "$daemon" -version | head -n 1
