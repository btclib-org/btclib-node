---
# the forms beside this file are the three kinds of issue this
# repository handles, and blank issues are off because each of the three
# asks for something a blank issue leaves out: which chain, which
# commit, and what the node did instead. Discussions are not enabled
# here, which is why a question has a form rather than being filed as a
# bug.
#
# The security entry is a link and not a form on purpose: a form would
# be a public issue, which is the one thing a vulnerability must not be.
# It points at this repository's own SECURITY.md, which is where the
# scope and the channel are stated together.
#
# Not at an advisory form, because there is none:
# `private-vulnerability-reporting` answers `enabled: false` here, which
# is btclib-org/btclib-node#136 and a setting rather than a file. The
# policy therefore gives an address, and this link becomes
# `/security/advisories/new` the moment that setting is on.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/btclib-org/btclib-node/blob/main/SECURITY.md
    about: >
      Never a public issue. That policy gives the address that reaches a
      maintainer privately about a node that can be made to accept,
      reject or leak something it should not, and says what is this
      node's to answer for rather than btclib's or Bitcoin Core's.
  - name: Keys, scripts, transactions, serialization
    url: https://github.com/btclib-org/btclib/issues
    about: >
      What this node validates *with* is btclib. If the wrong thing is
      parsed, signed or verified rather than the wrong thing done with
      it, the defect is most likely there.
  - name: What the protocol or the reference node does
    url: https://github.com/bitcoin/bitcoin/issues
    about: >
      Consensus and the p2p protocol are Bitcoin Core's to define. This
      node disagreeing with it is a bug here; the definition itself is a
      question for upstream.
