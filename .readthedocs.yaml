---
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# The dotted name is the canonical one; readthedocs.yml is honored too,
# but documented as deprecated.
#
# The build has to install the project itself, not sphinx alone: the
# autodoc directives in docs/source/*.rst import the module, a failed
# import is a sphinx warning rather than an error, and a "requirements:
# docs/requirements.txt" install therefore publishes a bare module title
# with no API beneath it, silently.
#
# What this file cannot say is *which* versions run it: that is
# settings on the project's own side, which REPOSITORY.md's "Read the
# Docs, which is btclib-node.readthedocs.io" reads back.

# Required
version: 2

# the interpreter is declared rather than left to whatever read the docs
# defaults to: conf.py reads the version and the project name out of
# pyproject.toml with tomllib, which is standard library from 3.11 on. Which
# version above that floor is `.python-version`'s to say, 3.14 -- these
# docs are built twice, here and by docs.yml, and one interpreter is what
# keeps the build read on the website and the build that gates a merge from
# being two different questions
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  # build.commands rather than the sphinx: and python: keys, which cannot
  # express this and are rejected when it is present.
  # autodoc has to import the module, so the project has to be installed,
  # and what read the docs can express natively is "pip install ." plus a
  # requirements file. uv installs the docs dependency group instead,
  # from uv.lock, which is why there is no docs/requirements.txt: the
  # group in pyproject.toml is the single declaration and the lock pins
  # it, where a requirements file would be unpinned and kept in step by a
  # header asking a human to do it.
  # uv itself is not pinned, deliberately: no dependabot ecosystem watches
  # this file, so a pin here is a version nobody bumps, and --locked makes
  # the uv version irrelevant to what gets installed -- uv.lock decides
  # that, and a uv too old to read the lock fails loudly rather than
  # resolving something else.
  # -W turns a failed import into a failed build, which is the point of
  # the whole file, and reports every warning a run raises before failing
  # at the end of it, so one broken page does not hide the next. -n turns
  # an unresolved cross-reference into a warning for -W to catch --
  # conf.py's own intersphinx_mapping and nitpick_ignore are what -n is
  # checked against
  commands:
    - pip install uv
    - uv sync --locked --no-default-groups --group docs
    - >-
      uv run --locked --no-default-groups --group docs
      sphinx-build -W -n -b html docs/source $READTHEDOCS_OUTPUT/html
