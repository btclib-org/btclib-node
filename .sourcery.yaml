---
# Sourcery's configuration, which the job sourcery.yml calls reads.
# Section 10 of the organization's standard, *The set, and its cadence*,
# says what it holds. The rules turned off are TURNED_OFF's in
# btclib-org/.github's tests/hooks_test.py, each beside the rule of
# another gate, as section 10 says.
version: "1"

# Bitcoin Core's files that tests/_data/README.md pins byte for byte: a
# finding there is upstream's, and a skip would end the copy being byte
# for byte. Section 10 admits this exception alone, and pinned() in that
# repository's tests/hooks_test.py is the reading that holds it.
ignore:
  - tests/**/_data

rule_settings:
  disable:
    - dont-import-test-modules # ruff's relative-imports (TID252)
  # the lowest interpreter this tree's code runs on: pyproject.toml's
  # requires-python floor
  python_version: "3.14"
