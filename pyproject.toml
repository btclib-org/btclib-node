[project]
name = "btclib-node"
# The shape a checkout of `main` carries between releases: the month
# the cycle is open on, and no day. `RELEASING.md`'s *Which version
# string is which* has the three shapes one cycle takes and what each
# means; `version-check` refuses this one on a tag, so it is a version
# no release can be cut on. The day is added on release day.
version = "2026.8"
description = "Bitcoin node in python"
authors = [{ name = "Giacomo Caironi", email = "giacomo.caironi@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
# Above the standard's 3.10 floor, deliberately: this is the version
# .python-version pins, and with no CI matrix here
# (btclib-org/btclib-node#33) it is the only version anything runs on.
# A lower bound would be a claim of support nothing checks. Lower it to
# whatever the matrix covers once there is one.
requires-python = ">=3.14"
# Floors only, here and in the dependency groups below: an upper bound
# on a release nobody has seen break is a guess, and uv.lock is what
# decides what any given checkout installs. Exact versions are pinned
# when a release is cut, not while the tree is developed. Each floor is
# the release this tree is developed against; btclib's is also the
# release whose API this code is written to, anything older wanting
# `merkle_root_` and taking `check_validity` positionally. What this
# tree is actually built and tested against is not that release but
# btclib's `main`: [tool.uv.sources] below says so, and says why.
dependencies = [
    # The `secp256k1` extra, not an optional-dependencies table of this
    # package's own: btclib-org/btclib-node#361 is where dependency
    # versus extra was decided, and why.
    "btclib[secp256k1]>=2026.8.21",
]
# What this repository is about, in the order a reader ranks them:
# PyPI shows keywords as the metadata gives them, and GitHub sorts its
# own topics, so the order decides only which one goes when the twenty
# GitHub allows are full. Lowercase throughout, a GitHub topic being
# lowercase or not a topic, so one spelling serves both lists. The
# topics set on the repository are the other half of this list and are
# not in any file: REPOSITORY.md records the call that reads them back.
#
# What is not here: `python`, which names no feature and is what the
# `Programming Language ::` classifiers below already say; and
# `bitcoin-core`, which names the node this one is not.
keywords = [
    "bitcoin",
    "bitcoin-node",
    "full-node",
    "blockchain",
    "consensus",
    "p2p",
    "script-interpreter",
    # sqlite and not leveldb, which is what this stores through today: a
    # keyword is what somebody searches with, and the storage layer is
    # moving. The classifiers below are the other kind of claim -- each
    # has to be true on the day it is read -- which is why the difference
    # is worth naming here rather than left to look like an oversight
    "sqlite",
]
# What an index shows somebody deciding whether to install this, and
# each line is a claim about this tree rather than a line copied from a
# sibling's.
#
# One interpreter, because `requires-python` above is `>=3.14` and its
# comment says why: with no CI matrix here, a lower bound would be a
# claim of support nothing checks, and a classifier is that claim made
# to an index.
#
# `Typing :: Typed` is below, and only because `src/btclib_node/py.typed`
# now ships: the classifier is machine-readable and a downstream type
# checker acts on it, so it is not declared ahead of the marker it
# reports on (btclib-org/.github#239).
#
# No PyPy, and the reason is no longer plyvel: that dependency is gone,
# and with it the C extension built from source against a LevelDB the
# reader had to install first. What is left is the line at the top of
# this file -- `requires-python = ">=3.14"`, and no PyPy release targets
# 3.14. `Implementation :: CPython` is that bound restated where an
# index reads it, and it needs no dependency to justify it.
#
# No `OS Independent` either, and nothing in the dependencies argues
# against it any more: what this installs is btclib and what btclib
# pulls in, `btclib-secp256k1` and `cffi` among them now compiled
# rather than pure Python, but wheeled for macOS, Linux and Windows
# alike and carrying an sdist besides, over a store that is now the
# standard library's `sqlite3`. Nothing here is known to need a POSIX
# system. What is missing is not a reason to think it does, it is a run
# on the platforms this does not name: the suite runs on `ubuntu-latest`
# before every merge and on `macos-latest` weekly, which is the two
# classifiers below and no more. `OS Independent` is a claim about every
# platform, and this is a claim about where the code has been run.
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
    # the README's own claim, made of the 2023 prototype that `v0.1.0`
    # tags and still made here: this node downloaded and validated the
    # whole chain, which is past pre-alpha and short of what a beta
    # would promise about its interfaces
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    # where this gets developed and where it gets run: nothing here has
    # ever run on Windows, and at least two things are already known to
    # stop it. `loop.add_reader`, which both p2p/manager.py and
    # rpc/manager.py call, is not implemented by the Proactor event
    # loop that is Windows' default. `signal.SIGTSTP` does not exist
    # there either; it is reached only by the three scripts/chains
    # entry points, which call install_signal_handlers, and not by
    # building a Node itself (issue #429). The list is a lower bound,
    # not an inventory, and whether to support Windows at all is issue
    # #430's to decide.
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Topic :: Internet",
    "Topic :: Security :: Cryptography",
]

# the seven links section 3 of btclib-org/.github names, keyed as
# btclib, btclib-secp256k1 and bitcoin-core-rpc key them, so the index
# reports the same spelling across every published sibling.
# `documentation` follows the same `<repository>.readthedocs.io` pattern
# those three already answer to rather than a guess: it is not connected
# yet -- REPOSITORY.md's "No Pages and no Read the Docs" -- and the link
# 404s until it is, docs/ (issue #264) being what a project has to exist
# before one can be connected to it.
[project.urls]
homepage = "https://btclib.org"
documentation = "https://btclib-node.readthedocs.io"
download = "https://github.com/btclib-org/btclib-node/releases"
# RELEASE_NOTES.md and not CHANGELOG.md: this url is what an index puts
# behind "Changelog", and what a user following it wants is the release
# notes, not the record behind them. CHANGELOG.md is linked from the
# first lines of that file
changelog = "https://github.com/btclib-org/btclib-node/blob/main/RELEASE_NOTES.md"
repository = "https://github.com/btclib-org/btclib-node"
issues = "https://github.com/btclib-org/btclib-node/issues"
pull_requests = "https://github.com/btclib-org/btclib-node/pulls"

[dependency-groups]
# The test runner and its plugins, nothing else.
harness = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    # spells its marker `pytest.mark.order(n)`; the similarly named
    # pytest-ordering is a different, unmaintained package that does not
    # run under pytest 9.
    "pytest-order>=1.5.0",
    # bounds a test, so that a node that stops answering fails the run
    # instead of hanging it (btclib-org/btclib-node#98). The limit is in
    # [tool.pytest.ini_options] below.
    "pytest-timeout>=2.4.0",
]
# harness, plus what the suite delegates to.
test = [
    { include-group = "harness" },
    # No "toml" extra: pytest-cov absorbed it and warns on the name now.
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
]
# mypy runs from this environment rather than from a hook's own --
# .pre-commit-config.yaml's mypy hook is where that decision is argued.
# types-requests is the one stub package this environment needs,
# requests being a test dependency that ships none.
lint = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
    "mypy>=1.18.2",
    "types-requests>=2.32",
]
# mutation testing, which asks the question coverage cannot: a line the
# suite executes is not a line the suite checks. Its own group and not
# part of test, because every cell of the gate installs that one and
# none of them runs this -- the scheduled mutation workflow is the only
# consumer, and it asks for --group test as well, cosmic-ray shelling
# out to pytest.
mutation = ["cosmic-ray"]
# what fuzz.yml runs the harnesses under fuzz/ with, and its own group
# for the reason mutation above is one: no cell of the gate runs a
# fuzzer, and the sentinel is the only consumer.
# The marker is atheris's own wheel list rather than a claim about this
# tree: the distribution is manylinux x86_64 wheels and no source
# archive, so a resolution for macOS has nothing to take and `uv sync`
# on a developer's machine would fail on a group it never runs.
# fuzz.yml pins ubuntu-latest, which is what the marker admits.
fuzz = ["atheris>=3.1.0; sys_platform == 'linux'"]
# what `docs.yml` and `.readthedocs.yaml` both build `docs/source` with:
# myst-parser for the root markdown files pulled into the toctree,
# sphinx itself, and furo, the theme `docs/source/conf.py` sets as
# `html_theme` (btclib-org/.github#329).
docs = ["furo", "myst-parser", "sphinx"]
# the distribution files are built and published by uv itself; what this
# group holds is what inspects them, before an upload consumes the
# version release.yml's `dist` job checks. Named check, not build, for
# the reason bitcoin-core-rpc's own pyproject.toml gives: `--only-group
# build` would mean one thing here and a wheel-building group in a
# repository that compiles one
check = ["check-sdist", "check-wheel-contents", "pyroma", "twine"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "mutation" },
    { include-group = "docs" },
    { include-group = "check" },
]

[tool.uv]
# the oldest uv that may read uv.lock, at the ceiling rather than below
# it -- btclib-org/.github's README.md, section 1, argues why; section
# 15 carries the command that re-derives the ceiling
required-version = ">=0.12.1"

[tool.uv.sources]
# btclib's `main`, and not its last release, because the two are
# developed together: btclib's p2p package was written against this node
# and cites its defects by file and function, and this node is what
# exercises that package against a live network. What a node measures
# itself against is therefore what btclib is now, so that a defect found
# here is one fixable there in the same week rather than at the next
# release -- and so that an API this tree is written to is broken by the
# commit that breaks it and not, months later, by the release carrying
# it.
#
# The cost is that a source distribution of btclib is built on every
# resolve, that a checkout needs git to install, and -- the one this
# repository cannot absorb on its own -- that nothing here runs against
# that branch as it moves: test.yml runs `uv run --locked`, so what the
# suite exercises is the commit uv.lock pins and not btclib's tip. A
# break therefore arrives at the re-lock that takes it, and reaches a
# developer's local run before any job. That pin is what keeps it from
# arriving unannounced: a checkout is reproducible and a re-lock is what
# moves it, deliberately, the way any other dependency moves.
#
# The floor in [project.dependencies] above stays, and is not made
# redundant by this: [tool.uv.sources] is uv's and is dropped from the
# metadata anything else reads, so the floor is what pip resolves.
btclib = { git = "https://github.com/btclib-org/btclib", branch = "main" }

[build-system]
# What declares the contents of a distribution here is a set of glob
# patterns in the [tool.uv.build-backend] table below, beside the rest of
# the configuration, in place of the separate include and exclude
# language of a MANIFEST.in.
#
# What the floor buys is the sdist's own pyproject.toml being a normalized
# copy of this file with the verbatim one kept beside it as
# pyproject.toml.orig -- and that arrives in 0.12.0, not here. Measured by
# calling the backend's own hook at each version, `uv build` being no use
# for the question: given a `requires` its own version does not satisfy it
# falls back to the copy bundled in the running uv and only warns, so it
# answers for that copy rather than for the pin.
#
#     uv run --no-project --with uv_build==<version> python -c \
#       "import uv_build; print(uv_build.build_sdist('<outdir>'))"
#
# The floor therefore sits above that boundary rather than on it, which is
# the deliberate half: 0.12.5 is the uv this tree is developed and gated
# against, being the rev .pre-commit-config.yaml pins for uv-pre-commit,
# so the backend that builds an archive here is the one whose lock format
# that hook writes. btclib-org/btclib#1267 is where the boundary is being
# weighed for btclib, which is the tree this pin comes from. The ceiling
# is the next minor, which is where uv's versioning policy puts a breaking
# change, this backend releasing with uv and versioned by it.
# btclib-org/.github#118 is where a pure-Python project was decided onto
# this backend
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# `module-name` is not written beside this: it defaults to `project.name`
# normalized, which is this name already, and a second declaration is a
# second thing to keep in agreement
#
# What the sdist carries beyond what the backend puts there by itself --
# pyproject.toml, the module under `module-root`, and the files
# `project.readme` and `project.license-files` name. Patterns are anchored,
# so `*.md` is the root's own markdown and does not reach tests/_data/
# README.md, and `/**` is what recurses.
#
# This is the first statement of what this sdist holds rather than a
# translation of an older one: the backend was setuptools and no
# MANIFEST.in was ever written, so the archive was whatever that backend
# defaulted to and nobody had declared it. What it left out was the
# suite, and every configuration file of the lint gate that is a file of
# its own: pyproject.toml went, so the tools reading their settings from
# this file were served and the hooks keeping one of their own were not.
# What this table produces instead is read off the archive rather than
# listed here,
#
#     tar tzf dist/*.tar.gz | sed 's|^[^/]*/||' | sort
#
# and CHANGELOG.md's entry for this change carries the pair of builds
# that shows the difference.
#
# The gate is what the list is drawn from: the configuration a hook of
# .pre-commit-config.yaml reads travels with the sources it is a rule
# about -- that file itself and .yamllint.yaml under `*.yaml`,
# .markdownlint.jsonc under `*.jsonc`, .taplo.toml under `*.toml`,
# .secrets.baseline named, and the .python-version and uv.lock that the
# local mypy hook's `uv run --locked` resolves against.
#
# It does not follow that the gate runs from an unpacked archive, and it
# does not: `git init` in one, then `pre-commit run --all-files`, exits 1
# at check-hooks-apply, which names the hooks left with no file to read.
# Adding `.github/**` here would ship that directory and is allowed --
# check-sdist's default ignore list suppresses a *report* about it and
# says nothing about what the backend packs, an archive carrying it being
# reported as matching git. It is left out as a decision rather than
# because anything refuses it, and the reason is that it buys nothing
# here: with `.github/**` added the same run still exits 1, on the hooks
# whose files are the workspaces [tool.check-sdist] keeps back. What this
# list buys is that a tool reading a file of this tree finds it, not that
# every tool has something to read.
#
# COPYRIGHT is not here, having no extension for `*.md` to sweep it in
# by. btclib-org/.github#135 is why it is not named instead: it is a
# repository file rather than a distributed one, LICENSE carrying the
# holder a consumer needs, and this being the source of a source-file
# header. `license-files` above names LICENSE and AUTHORS.md, so
# nothing else puts COPYRIGHT in the archive either. What the CPY rule
# checks the sources against is notice-rgx in this file, which travels
# regardless.
source-include = [
    "*.jsonc",
    "*.md",
    "*.toml",
    "*.yaml",
    ".python-version",
    ".secrets.baseline",
    "uv.lock",
    "docs/**",
    "scripts/**",
    "tests/**",
]
# Exclusions win over the inclusions above, and are unanchored unless a
# pattern starts with "/": a bare name matches at any depth, and everything
# below a match goes with it. Each line here was measured by planting the
# file and building, and each shipped without it. __pycache__, *.pyc and
# *.pyo are the backend's own default excludes, which is why a stray one
# under tests/ needs no line where a cache does.
#
# A cache is what the tools of this gate write. At the root none of them
# is reached by an include pattern above and no line would be needed; the
# case these answer is the nested one, `tests/**` and `scripts/**` taking
# whatever sits under those directories. For mypy that is not
# hypothetical: .vscode/extensions.json recommends
# ms-python.mypy-type-checker, and that extension writes a cache per
# directory it type-checks rather than one at the root. The rest are
# written where their tool is invoked, which is a directory a developer
# chooses.
#
# `*.egg-info` is the line this gate needs for itself: the check-sdist
# hook's --inject-junk drops one under tests/ for the length of the run,
# and without this it is reported as a member of the sdist that git has
# not got.
#
# check-sdist reads this list for the uv backend, so a tracked file a
# pattern here takes out is not reported as one the sdist is missing, and
# does not have to be named again in [tool.check-sdist] below
source-exclude = [
    # the one test that reads something outside tests/: fuzz/ is
    # git-only below, so this module would collect from an unpacked
    # sdist and fail on a directory that is not there. Anchored, for
    # the reason the docs line below is.
    "/tests/fuzz_corpus_test.py",
    # where sphinx-build writes, CONTRIBUTING.md's docs command and
    # docs.yml both naming docs/build/html: "docs/**" above reaches it,
    # so an sdist built after a local docs build would otherwise carry
    # the whole rendered site. Anchored, nothing else here being called
    # build.
    "/docs/build",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "*.egg-info",
]

[tool.check-sdist]
# Tracked files the sdist is meant not to carry, and the first thing in
# this repository to ask the question at all -- [tool.uv.build-backend]
# above is where what went unasked before it is written down. What that
# table's source-exclude names is not repeated here, check-sdist reading
# it for the uv backend, so this holds only what no include pattern adds
# in the first place: the workspaces of an editor and of an agent, the
# files git reads, and COPYRIGHT. Patterns are gitignore's, so a
# directory covers what is under it at any depth.
#
# CLAUDE.md travels with the archive under `*.md` and .claude/ does not,
# where section 13 of btclib-org/.github puts the two in one class. The
# split is the one .vscode/ sits on the far side of as well: root prose is
# what a reader of the archive reads, and a workspace configures working
# *in* the repository, which an unpacked archive is not.
#
# .github/ is not here because check-sdist's default ignore list already
# suppresses a report about it. That is not why the archive lacks it --
# that list has no say over what the backend packs, and
# [tool.uv.build-backend] above is where the omission is decided
git-only = [
    ".claude/",
    # the atheris harnesses and the seeds they start from, read by
    # fuzz.yml and by tests/fuzz_corpus_test.py and by nothing a package
    # installed from the sdist runs
    "fuzz/",
    ".gitattributes",
    ".gitignore",
    ".vscode/",
    "COPYRIGHT",
]

[tool.check-wheel-contents]
# a wheel that ships the directory `package` names, and an unrelated
# top-level file or an empty library needs no configuration to catch,
# check-wheel-contents' own defaults already flagging either. What
# defaults do not catch is a file the tree has and the wheel does not --
# `py.typed` dropped by a pattern that stopped reaching it, say --
# because with no `package` given check-wheel-contents reads the wheel's
# own RECORD and asks nothing about the source tree the wheel was
# supposed to carry. Naming it diffs the wheel's `btclib_node/` against
# this checkout's, file for file, in both directions (W101 missing, W102
# extra).
#
# `check-sdist` above already gates the sdist against this same tree (a
# pre-commit hook, gated by the lint workflow), so together the two
# amount to `git tree == sdist == wheel`, verified in one hop each
# rather than through a third script comparing the sdist to the wheel --
# a comparison a single-module package with no data directory has
# nothing to add to.
#
# W002 is the one default this tree does trip, and by content rather
# than by path: `p2p/__init__.py` and `rpc/__init__.py` are each three
# lines of the copyright notice and nothing else, so the two are
# byte-identical, and check-wheel-contents flags any two wheel members
# that are. Every other `__init__.py` under `src/btclib_node/` carries a
# module docstring beyond the notice and is not part of the pair --
# measured by hashing each one (`find src/btclib_node -name __init__.py
# -exec shasum -a 256 {} +`), rather than assumed from the rule firing.
# Two empty package markers sharing the same three lines is what an
# empty package looks like, not a build artifact duplicated by mistake,
# so the check is disabled rather than the coincidence chased away by
# giving one of the two files a docstring it has no other reason to
# carry.
ignore = ["W002"]
package = ["src/btclib_node"]

[tool.pytest.ini_options]
# The two modules beside the directories rather than under either are
# named on their own: `tests/interpreters_test.py` reads pyproject.toml,
# .python-version and the CI files against one another, and
# `tests/fuzz_corpus_test.py` reads fuzz/ -- so each mirrors no module of
# the package and drives no node. Naming one is what collects it -- and
# [tool.coverage.run]'s `source` takes all of tests/, so a module no run
# collects is a file the floor reports at zero. `tests/integration/`
# stays out: it needs a bitcoind, which integration-bitcoind.yml
# installs and a bare run has not got.
testpaths = [
    "tests/fuzz_corpus_test.py",
    "tests/interpreters_test.py",
    "tests/unit",
    "tests/functional",
]
# No `python_files`/`python_functions` here: every test module under
# tests/ is named `*_test.py`, which pytest's own default `python_files`
# already collects, and no test function needs a `python_functions`
# wider than pytest's own `test` prefix. Restating either is a second
# place for a fact pytest already states, and the second one to fall out
# of step with the tree.
addopts = "-n auto --strict-config --strict-markers --cov --cov-report term-missing:skip-covered --durations=10"
# No `markers = [...]` table needed beside `--strict-markers`: the only
# markers this suite uses are `pytest.mark.parametrize` (pytest's own)
# and `pytest.mark.order` (pytest-order, which registers its own), and
# `--strict-markers` reports nothing unregistered against this tree --
#
#   uv run pytest --collect-only -q --strict-config --strict-markers
#
# -- so this is a ratchet at zero cost, not a climb, the same shape as
# `xfail_strict` below.
# This suite has no `xfail` today (`grep -rn xfail tests/` matches only
# a comment in tests/_data/README.md, not a call), so this too costs
# nothing to turn on now rather than when the first one is written and
# nobody notices it stopped meaning anything.
xfail_strict = true
# What a single test is given before the run says which test hung and
# where, instead of sitting there. Measured rather than picked, over
# repeated runs of the whole suite under `-n auto`: the slowest test
# is tests/functional/p2p/download_test.py::test_download, 9.51s on an
# idle machine, 27.85s on one shared with other work, and 42.09s on
# one loaded past three times its core count. That is the bound that
# matters rather than the spread: a limit anywhere near where the suite
# reports which condition it was waiting on trades a diagnosis for a
# timeout, and this is nearly three times the worst of them while still
# turning the ten-minute hangs of btclib-org/btclib-node#98 into a
# failure that names its test.
#
# It does not bound the deadlines beneath it and is not meant to. A test
# that waits seven times at wait_until's own default could in
# principle ask for more than this, and the run would then be killed by
# this limit rather than by the deadline that was actually missed --
# which loses the condition the test was waiting on. Nothing observed
# comes near it: the longest single wait measured anywhere is 12.60s,
# and the run that failed on a four-core runner reported at 20.24s.
# Issue #46 is where that starvation is tracked.
timeout = 120
# `["error"]`, once the fixtures in tests/conftest.py closed what
# tests/unit/main_test.py's regtest_node and its kind (issue #111,
# issue #195) left open -- a sqlite connection, a socket, an event
# loop or a worker pool, warned about by __del__ at whatever moment
# the collector reaches it, which is why the same tests used to fail
# this differently on every run. Two other warnings that turning this
# on surfaced are not that shape and stay out of this list: a
# deliberately unhandled exception on a manager's own thread and a
# deliberately unawaited coroutine, each provoked on purpose by the
# handful of tests that exercise it and silenced there with its own
# `pytest.mark.filterwarnings` rather than named here for the whole
# suite.
filterwarnings = [
    "error",
    # `TestNet` (`src/btclib_node/chains.py`) is a chain, not a test: pytest
    # collects any class whose name matches `Test*` and warns where it
    # cannot, `__init__` being what stops it here. Named to that one
    # class rather than to every class the blanket entry above used to
    # cover -- nothing here is renamed to dodge pytest's own default,
    # `python_classes` in this same table being what would have to
    # change instead, at the cost of the name the wire protocol and
    # every other repository reading it already agree on.
    "ignore:cannot collect test class 'TestNet'",
]

[tool.coverage.run]
# Named, rather than left to `--cov` alone: without it coverage measures
# whatever the run happened to import, so a module no test touches is
# absent from the report instead of appearing in it at zero -- the one
# case the number most needs to show.
source = ["btclib_node", "tests"]
# A guard clause whose branch is never taken reads as fully covered
# under statement coverage: the line ran, and that is all it measures.
# On a node whose defects are mostly in branches not taken, that is the
# wrong thing to count.
branch = true
# `tests/integration/*` beside the usual site-packages exclusion: every
# test there skips itself without a real bitcoind (`tests/integration/
# conftest.py`'s own `bitcoind_path` fixture), which is a body `source`
# above would otherwise still walk and report at zero the moment
# anything lands under that directory -- `source` is what makes an
# unimported module appear in the report in the first place, so the
# floor would fail for every contributor who has no bitcoind on an
# ordinary `uv run pytest`, which never even collects that directory
# (`testpaths`, in `[tool.pytest.ini_options]`, does not name it).
# `integration-bitcoind.yml` is what actually runs it, with its own
# unrelated guard against reporting a skip as a pass.
omit = ["*/site-packages/*", "tests/integration/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
# The tree is there, so this is what holds it: every statement and
# every branch of `btclib_node` and of `tests` is reached by the suite.
# A line that cannot be reached is not covered by lowering this, it is
# covered by deleting the line or by writing the test that reaches it.
fail_under = 100

[tool.ruff]
# target-version is inferred from project.requires-python

[tool.ruff.lint]
# The pair only makes sense together: naming a rule in `ignore` below
# instead of coding it is itself a preview feature, so `preview` is what
# buys `explicit-preview-rules`, which then takes back everything preview
# does *not* name below -- the stable set, plus `unspecified-encoding`
# alone, rather than every rule ruff is still designing.
preview = true
explicit-preview-rules = true
# Every rule family ruff ships, present ones and a release's future ones
# alike, rather than a hand-picked list: a list is a thing that rots,
# since nothing forces a second edit here the day ruff ships a family
# nobody has looked at yet. `ALL` takes a new family in on the pull
# request that bumps ruff's own pinned rev instead, which is the day
# somebody is already looking at what changed. Section 5 of the
# organization standard states the rule; `ignore` below is where every
# declined rule's reason lives -- a rule the formatter conflicts with,
# cited from ruff's own docs/formatter.md and not argued here since that
# list is the vendor's; a rule this tree declines on its own merits,
# argued beside it; or a finding that is real and is not in `ignore` at
# all, fixed at its site or answered with a `# noqa` that RUF100 retires
# the day it stops being needed.
select = ["ALL"]
# a rule and not a family, so it is here rather than in `select` above:
# `ALL` selects every stable rule ruff ships, and pylint's
# unspecified-encoding is PLW1514, which preview is where ruff keeps it.
# It asks that `open`, `Path.open`, `read_text`, `write_text` and the
# tempfile factories name an encoding, because a call that omits it
# takes the locale's: UTF-8 wherever this suite usually runs, cp1252 on
# Windows. .pre-commit-config.yaml carries the other half, `text=True`
# being the same locale-dependent decode one layer out.
extend-select = ["unspecified-encoding"]
# named rather than coded: an entry that suppresses a single rule can
# say which, so the reason sits in the comment and the rule sits in the
# entry, with no code left to look up between them
ignore = [
    # ruff's own docs/formatter.md, under "Conflicting lint rules",
    # fetched at the ruff revision pyproject.toml and
    # .pre-commit-config.yaml both pin (v0.16.4): each of these is
    # undone by the formatter's own rewriting, so selecting it is a
    # lint failure the next `ruff format` produces again. The list is
    # the vendor's, and does not change with this tree.
    # `incorrect-blank-line-before-class` (D203) needs no entry here:
    # the pep257 convention below already disables it in favour of
    # D211, the other half of the pair ruff calls incompatible, without
    # printing the warning ruff reserves for a pair nothing has
    # settled. `multi-line-implicit-string-concatenation` (ISC002)
    # needs none either: the vendor conditions it on being used without
    # ISC001 and with `allow-multiline` false, and ISC001 stays
    # selected here, which fails the first half on its own
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "unnecessary-escaped-quote",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    # code length is enforced by the formatter, which reflows to its 88
    # columns everything it is allowed to rewrite; max-doc-length below
    # measures the prose the formatter never touches.
    "line-too-long",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"] # re-exported imports
"tests/**" = [
    "ANN401", # a test double's own SimpleNamespace, standing in for a
    #            production type across every field a scenario needs
    #            and none it does not -- Any is what lets it satisfy
    #            whatever real parameter it is passed to (`node: Node`,
    #            `conn: Connection`) without a cast at every call site,
    #            or what lets a spy forward blindly to the real method
    #            it wraps (`socket.socket(*args, **kwargs)`,
    #            `Task.cancel(*args, **kwargs)`); read individually
    #            (issue #341) rather than swallowed as a family -- 4 of
    #            the 71 measured were narrowed to a real type instead
    #            (`AbstractContextManager[KeyValueStore]`,
    #            `Callable[..., object]`, `Iterable[Iterable[object]]`,
    #            a `Node` already built by an internal `cast`)
    "ARG001", # a monkeypatch replacement or a fake matching the real
    #           callable's own signature it stands in for -- a dispatch
    #           handler swapped into callbacks/handshake_callbacks the
    #           same way production's own handlers are (p2p/callbacks.py
    #           and rpc/callbacks.py above), Connection.send,
    #           update_chain, Loop.getaddrinfo/sock_accept, and the
    #           like -- unused by one stand-in for the reason it is
    #           unused by one production handler: the interface the
    #           real thing is called through is shared, not the fake's
    #           own choice. A second, smaller reason (2 sites, both
    #           tests/functional/p2p/block_filters_test.py): a pytest
    #           fixture requested only for its own construction's side
    #           effect (`mark`'s own docstring says which), not for a
    #           value the test reads. Read individually (issue #341)
    #           before this ignore was added, not assumed.
    "ARG002", # the method-argument shape of the same two reasons above
    "ARG005", # the lambda-argument shape of the same reasons -- most of
    #           this rule's own 63 findings, a `lambda *a: None` or
    #           `lambda node, tx: 0` standing in for a real callback of
    #           fixed arity
    "PLR0913", # a test double's own builder, one keyword-only arg per
    #            field of the object it stands in for -- the count is
    #            the production shape's, not a test helper's overreach
    "PLR2004", # a test's own literal expected value, not a magic number
    "S101",    # assert
    "S311",    # non-cryptographic random: fine in tests
    "SLF001",  # whitebox testing is this suite's method, not an
    #            accident: a test arms or reads the private state of the
    #            object it itself built -- a Connection's
    #            `_recv_resume`, the mempool's `_rolling_min_fee_rate` --
    #            because the invariant under test is about that state,
    #            and a public accessor added only so a test can avoid an
    #            underscore would widen the API for no caller. Every
    #            finding is under `tests/`; `src/btclib_node/` stays
    #            gated, its own few cross-object sites answered with a
    #            `# noqa` and a reason where they sit
    "EM101", # a test double raising with a raw string: the exception
    #            exists to be caught and asserted on by the test one
    #            screen away, so the assign-to-a-variable-first form the
    #            rule asks for adds a name nothing else reads. Every
    #            finding is under `tests/`; `src/btclib_node/` stays
    #            gated and is clean
]
# Every handler in p2p.callbacks.callbacks/handshake_callbacks is called
# uniformly (node, msg, conn) by p2p.main's handle_p2p/
# handle_p2p_handshake, and every one in rpc.callbacks.callbacks is
# called uniformly (node, conn, params) by rpc.main's handle_rpc: an
# argument one handler does not read is required by the dispatch
# table's own shared signature, not a mistake naming it would hide, and
# renaming it to `_` would lose that signature's own documentation for
# a table that calls every handler the same way. Read individually
# against both dispatch tables before this ignore was added (issue
# #341) -- every ARG001 finding in each file is one of its own
# registered handlers, none a free helper mistaken for one.
"src/btclib_node/p2p/callbacks.py" = ["ARG001"]
"src/btclib_node/rpc/callbacks.py" = ["ARG001"]
# socket.socket.setblocking is a C-level method taking no keyword
# arguments at all (verified directly: socket().setblocking(flag=False)
# raises "takes no keyword arguments"), so the every-call-site half of
# FBT003's own fix -- rewrite the call to name the argument -- is not
# available here, and there is no wrapper of this tree's own to make
# keyword-only either, socket.socket being the standard library's own
# class. Every FBT003 finding in each of these two files is one of its
# own `.setblocking(False)` calls (16 total, checked by hand rather
# than assumed): p2p/connection_test.py and rpc/connection_test.py each
# put a socketpair into non-blocking mode before handing one end to the
# Connection under test.
"tests/unit/p2p/connection_test.py" = ["FBT003"]
"tests/unit/rpc/connection_test.py" = ["FBT003"]
# `D101`/`D102`/`D103`/`D107` closed for `src/btclib_node/`'s own
# root-level modules and for `block_db/`, `chainstate/`, `p2p/` and
# `rpc/` in turn -- issue #373's own five-slice split, one package
# directory at a time, is done: no directory-wide deferral for any of
# these four codes is left under `src/btclib_node/`. `exceptions.py`'s
# own `D107` entry further down is the one reasoned suppression left,
# argued where it sits rather than deferred by directory.
# SphinxPostTransform.run itself is typed `(self, **kwargs: Any) -> None`
# (sphinx.transforms.post_transforms, read directly from the installed
# package rather than assumed) -- an override matching the base class's
# own signature is not a choice this file made, so ANN401 is not a
# per-site decision the way it is where this tree picks its own `Any`.
# INP001: sphinx imports conf.py by its own convention, reading
# docs/source/ as a configuration directory rather than a package, so
# an __init__.py there would misrepresent it as one.
"docs/source/conf.py" = ["ANN401", "INP001"]
# flake8-no-pep420: each of these is a standalone entry point -- a
# workflow step's "python .github/scripts/<name>.py", or a script a
# person runs from a checkout -- never an import. The directories hold
# no __init__.py because they are not packages, and adding one to
# satisfy this rule would make each look like one.
".github/scripts/*.py" = ["INP001"]
"scripts/**" = ["INP001"]
# reset_chainstate.py and reset_download.py are each a template edited
# by hand before a run, not a program run as-is: their reset itself is
# commented out on purpose, one block per operation, so whoever runs
# the script picks which by uncommenting it. Each block is kept current
# against the index's own API across refactors -- most recently issue
# #117 -- rather than left to rot, which is what distinguishes this
# from ERA001's usual leftover.
"scripts/reset_chainstate.py" = ["ERA001"]
"scripts/reset_download.py" = ["ERA001"]
# a manual diagnostic run over local error test vectors: the `print`s
# are its progress and its result, not debug residue left behind.
"scripts/test_errors.py" = ["T20"]
# the same reason, for a script a workflow runs rather than a person: a
# GitHub Actions step reads its result from stdout, not from a return
# value, so `check_vendored_pin.py`'s prints are its report and not
# debug residue either.
".github/scripts/check_vendored_pin.py" = ["T20"]
# every __init__ in this file is one line, super().__init__(message) or
# a formatted message built from its own arguments -- what it does is
# already the whole of what the class's own docstring says, so a
# docstring on the __init__ too would repeat it rather than add
# anything a reader does not already have (issue #373).
"src/btclib_node/exceptions.py" = ["D107"]
# fuzz.yml hands a harness to the interpreter as a script and nothing
# imports one, so fuzz/ holds no __init__.py: adding one to satisfy this
# rule would make the directory look like a package of this project
"fuzz/*.py" = ["INP001"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
# section 5 of the organization standard; what settles the pairs ruff
# calls incompatible (D203/D211, D212/D213), so `ignore` above does not
# name the half a convention already disables
convention = "pep257"

[tool.ruff.lint.flake8-copyright]
# COPYRIGHT is the one place the notice text is written down; this is all
# three of its lines as one regex rather than only the holder line, so a
# file keeping the first and dropping the license lines below it does not
# pass. Anchored with ^: unanchored, CPY001 is a search over the first
# 4096 bytes and not a check that the notice opens the file.
notice-rgx = "^# Copyright \\(c\\) The btclib developers\\n# Distributed under the MIT software license, see the accompanying\\n# LICENSE file or https://opensource\\.org/license/mit for the full text\\."

[tool.codespell]
# "clear" alone, where codespell's default is "clear,rare": measured
# over this tree, "clear" alone already found and fixed every genuine
# typo this repository had, in README.md, a docstring, a comment and a
# handful of identifiers -- so the other three builtins were not tried,
# there being nothing left here for them to add.
builtin = "clear"
# the vendored vectors are skipped rather than corrected: a test vector
# has to stay byte for byte what upstream published, so a typo inside a
# Bitcoin Core comment is part of the vector -- `unparseable` in
# blockfilters.json is one. tests/_data/README.md pins those files by
# blob sha, and this line is what keeps a spell checker from unpinning
# them. By extension rather than by directory, so that
# tests/_data/README.md itself -- prose *about* the data, not the data
# -- is still spell checked.
# fuzz/corpus/'s seeds join them, against the day one is readable rather
# than because today's three are. pre-commit's own types: [text] filter
# rejects a file carrying any byte in 0x00-0x06, 0x0E-0x1A, 0x1C-0x1F or
# 0x7F -- not a NUL alone -- and each of the three seeds carries one, so
# no speller opens them as things stand. A reject message whose code is
# 0x40-0x43 and whose fields are long enough is constructible entirely
# inside that text set, and would be read as prose by a tool that runs
# with --write-changes. A "correction" inside one would invalidate the round
# trip tests/fuzz_corpus_test.py holds it to, in a rewrite of a .bin
# nobody reads a diff for.
skip = "*/_data/*.json,*/_data/*.csv,*/_data/*.txt,*/_data/*.bin,fuzz/corpus/*"
# a misspelling written on purpose goes in backticks, and that is a rule
# rather than a preference: prose that configures a spell checker has to
# be able to name what it catches, and the comment above costs this hook
# a finding for the one word it is about without it. codespell has no
# per-file configuration, so this holds everywhere it reads; what it
# hides is what is written inside backticks, which is identifiers and
# quoted strings -- typos' half of the work, not this hook's.
ignore-regex = '`[^`]*`'

[tool.typos.files]
# the vendored data [tool.codespell] skips above, for the reason given
# there, and written again rather than shared because the glob syntax
# differs: `*/_data/*.json` matches at any depth for codespell and one
# directory deep for typos. This hook runs with --write-changes, so
# getting it wrong is a rewrite of a pinned vector and not a report.
extend-exclude = [
    "**/_data/*.json",
    "**/_data/*.csv",
    "**/_data/*.txt",
    "**/_data/*.bin",
    # the same seeds [tool.codespell] skips above, for the reason given
    # there. --force-exclude is what makes this entry reach the hook at
    # all: pre-commit names files on the command line, and typos
    # otherwise overrides an exclude for a path named that way
    "fuzz/corpus/**",
]

[tool.mypy]
# scripts/ and .github/scripts/ are here for the same reason: a script
# that no longer imports is a script nobody runs, and neither directory
# has anything else that reads it -- .github/scripts/ least of all,
# invoked only by a scheduled workflow and collected by no test. This is
# the list the lint gate runs on and not only the one a bare `mypy`
# reads: the hook in .pre-commit-config.yaml passes no paths of its own,
# for the reason given there. Section 6 of btclib-org/.github's README
# states the scope as the package, the tests and .github/scripts.
# fuzz/ is outside it because atheris is: the harnesses import a package
# the `fuzz` dependency group installs and the lint environment does
# not, so what mypy would report there is the import rather than the
# harness. tests/fuzz_corpus_test.py is inside it, and reads a harness
# without importing one.
files = ["src/btclib_node", "tests", "scripts", ".github/scripts"]
# the floor `project.requires-python` declares, and not the interpreter
# that happens to be running: a name added to the standard library
# later passes here and fails for whoever is on the oldest version this
# package says it supports. btclib-org/btclib-node#30 describes the
# floor as 3.10, which is stale -- against 3.10 mypy reports that
# `datetime.UTC` does not exist, and it is right about 3.10.
python_version = "3.14"

# The organization's standard requires this outright (section 6 of
# btclib-org/.github's README, tracked for every repository as
# btclib-org/.github#112): not a trajectory toward it, and not the same
# bundle of flags enumerated one at a time in its place -- that table
# states which checks the tree passes and leaves what is annotated to
# be read tree by tree, where `strict = true` states that every
# function in `files` declares its types. `check_untyped_defs` was the
# one member of the bundle this table still left off:
# btclib-org/btclib-node#105 read what it found one at a time, and what
# is left after #104's annotation pass measures at zero --
#
#   uv run --locked --no-default-groups --group lint --group test \
#     mypy --check-untyped-defs
#
strict = true
# Take a line out of this table and mypy's own parsing of the file says
# what it was buying: each setting from here down to the divider below
# answers `False` with its line removed, so `strict = true` above asks
# for none of them --
#
#   uv run --locked --no-default-groups --group lint --group test \
#     python -c "from mypy.main import process_options; \
#       print(process_options(['--config-file', 'pyproject.toml'], \
#         require_targets=False)[1].warn_unused_configs)"
#
# -- where `strict_bytes` answers `True` with a line and without one,
# so it has none here. `mypy --help` names a setting mypy has on in the
# negative, as `--no-strict-bytes`; `--hide-error-codes` reads the same
# way, which is why `show_error_codes` is absent here.
warn_unused_configs = true
# a branch mypy can prove is never taken is a branch no test can cover,
# and this tree is held to covering all of them
warn_unreachable = true
# the sample names this one too, and it earns its line: an error names
# the column it starts at and not the line alone
show_column_numbers = true

# --- the optional error codes, surveyed one at a time ------------------
#
# Same method: enable, measure, decide. Each reports nothing today, and
# each is a code mypy leaves off until something turns it on, which is
# the whole of what this list is for. A code mypy already has on reports
# whether it is named here or not, so an entry for one buys no check and
# spends a line claiming it did. That is what a candidate is put through
# first --
#
#   uv run --locked --no-default-groups --group lint --group test \
#     python -c "import mypy.errorcodes as m; \
#       print(m.error_codes['import-untyped'].default_enabled)"
#
# -- and a code answering `True` belongs outside this list, whatever it
# reports. Answering `False` is not on its own enough to be in it:
# `unused-ignore` answers `False` and stays out, `warn_unused_ignores`
# being the flag form of it and one `strict = true` above sets.
enable_error_code = [
    "deprecated",
    # what this answers is the first `match` written under `files`
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.typos.default.extend-words]
# ruff's copyright rule, not the misspelling of COPY or CPU that typos'
# dictionary offers -- .pre-commit-config.yaml names it in a comment.
CPY = "CPY"
