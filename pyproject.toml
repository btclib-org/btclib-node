[project]
name = "btclib-node"
version = "0.1.0"
description = "Bitcoin node in python"
authors = [{ name = "Giacomo Caironi", email = "giacomo.caironi@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Above the standard's 3.10 floor, deliberately: this is the version
# .python-version pins, and with no CI matrix here
# (btclib-org/btclib-node#33) it is the only version anything runs on.
# A lower bound would be a claim of support nothing checks. Lower it to
# whatever the matrix covers once there is one.
requires-python = ">=3.14"
# Floors only, here and in the dependency groups below: an upper bound
# on a release nobody has seen break is a guess, and uv.lock is what
# decides what any given checkout installs. Exact versions are pinned
# when a release is cut, not while the tree is developed. Each floor is
# the release this tree is developed against; btclib's is also the
# release whose API this code is written to, anything older wanting
# `merkle_root_` and taking `check_validity` positionally. What this
# tree is actually built and tested against is not that release but
# btclib's `main`: [tool.uv.sources] below says so, and says why.
dependencies = [
    "btclib>=2026.8.21",
]
# What this repository is about, in the order a reader ranks them:
# PyPI shows keywords as the metadata gives them, and GitHub sorts its
# own topics, so the order decides only which one goes when the twenty
# GitHub allows are full. Lowercase throughout, a GitHub topic being
# lowercase or not a topic, so one spelling serves both lists. The
# topics set on the repository are the other half of this list and are
# not in any file: REPOSITORY.md records the call that reads them back.
#
# What is not here: `python`, which names no feature and is what the
# `Programming Language ::` classifiers below already say; and
# `bitcoin-core`, which names the node this one is not.
keywords = [
    "bitcoin",
    "bitcoin-node",
    "full-node",
    "blockchain",
    "consensus",
    "p2p",
    "script-interpreter",
    # sqlite and not leveldb, which is what this stores through today: a
    # keyword is what somebody searches with, and the storage layer is
    # moving. The classifiers below are the other kind of claim -- each
    # has to be true on the day it is read -- which is why the difference
    # is worth naming here rather than left to look like an oversight
    "sqlite",
]
# What an index shows somebody deciding whether to install this, and
# each line is a claim about this tree rather than a line copied from a
# sibling's.
#
# One interpreter, because `requires-python` above is `>=3.14` and its
# comment says why: with no CI matrix here, a lower bound would be a
# claim of support nothing checks, and a classifier is that claim made
# to an index.
#
# No `Typing :: Typed`: this package ships no `py.typed`, and its mypy
# is not strict yet -- the annotation pass is btclib-org/.github#9's.
# The classifier is machine-readable and a downstream type checker acts
# on it, so declaring it before the marker exists would be read by a
# tool rather than by a person.
#
# No PyPy, and the reason is no longer plyvel: that dependency is gone,
# and with it the C extension built from source against a LevelDB the
# reader had to install first. What is left is the line at the top of
# this file -- `requires-python = ">=3.14"`, and no PyPy release targets
# 3.14. `Implementation :: CPython` is that bound restated where an
# index reads it, and it needs no dependency to justify it.
#
# No `OS Independent` either, and nothing in the dependencies argues
# against it any more: what this installs is btclib and what btclib
# pulls in, all pure-Python wheels, over a store that is now the
# standard library's `sqlite3`. Nothing here is known to need a POSIX
# system. What is missing is not a reason to think it does, it is a run
# on the platforms this does not name: the suite runs on `ubuntu-latest`
# before every merge and on `macos-latest` weekly, which is the two
# classifiers below and no more. `OS Independent` is a claim about every
# platform, and this is a claim about where the code has been run.
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    # 0.1.0, and the README's own claim for it: this node downloaded and
    # validated the whole chain, which is past pre-alpha and short of
    # what a beta would promise about its interfaces
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    # where this gets developed and where it gets run; Windows is left
    # out because nothing here runs it, not because anything is known to
    # stop it
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Topic :: Internet",
    "Topic :: Security :: Cryptography",
]

[dependency-groups]
# The test runner and its plugins, nothing else.
harness = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "pytest-remotedata>=0.4.2",
    # spells its marker `pytest.mark.order(n)`; the similarly named
    # pytest-ordering is a different, unmaintained package that does not
    # run under pytest 9.
    "pytest-order>=1.5.0",
    # bounds a test, so that a node that stops answering fails the run
    # instead of hanging it (btclib-org/btclib-node#98). The limit is in
    # [tool.pytest.ini_options] below.
    "pytest-timeout>=2.4.0",
]
# harness, plus what the suite delegates to.
test = [
    { include-group = "harness" },
    # No "toml" extra: pytest-cov absorbed it and warns on the name now.
    "pytest-cov>=7.1.0",
    "pydeps>=3.0.7",
    "requests>=2.34.2",
]
# mypy is here so that the hook can run it from this environment rather
# than from one of its own: the hosted mirrors-mypy hook it replaces
# resolved neither btclib nor pytest, and the mirror's default
# --ignore-missing-imports turned each of those imports into Any without
# a word. types-requests is the one stub package that hook carried and
# this environment still needs, requests being a test dependency that
# ships none.
# Not strict yet, which is a separate step and a large one: mypy --strict
# over this tree reports 2134 errors in 63 of its 69 files, 595 of them
# a definition with no annotation and 1475 calls to one. That is the
# annotation pass btclib-org/.github#9 defers, and it is not what moving
# the hook needs.
lint = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
    "mypy>=1.18.2",
    "types-requests>=2.32",
]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.uv.sources]
# btclib's `main`, and not its last release, because the two are
# developed together: btclib's p2p package was written against this node
# and cites its defects by file and function, and this node is what
# exercises that package against a live network. What a node measures
# itself against is therefore what btclib is now, so that a defect found
# here is one fixable there in the same week rather than at the next
# release -- and so that an API this tree is written to is broken by the
# commit that breaks it and not, months later, by the release carrying
# it.
#
# The cost is that a source distribution of btclib is built on every
# resolve, that a checkout needs git to install, and -- the one this
# repository cannot absorb on its own -- that nothing here runs against
# that branch as it moves: test.yml runs `uv run --locked`, so what the
# suite exercises is the commit uv.lock pins and not btclib's tip. A
# break therefore arrives at the re-lock that takes it, and reaches a
# developer's local run before any job. That pin is what keeps it from
# arriving unannounced: a checkout is reproducible and a re-lock is what
# moves it, deliberately, the way any other dependency moves.
#
# The floor in [project.dependencies] above stays, and is not made
# redundant by this: [tool.uv.sources] is uv's and is dropped from the
# metadata anything else reads, so the floor is what pip resolves.
btclib = { git = "https://github.com/btclib-org/btclib", branch = "main" }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["btclib_node*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/functional"]
python_files = "*.py"
python_functions = "test*"
addopts = "-n auto --remote-data=any --cov --cov-report term-missing:skip-covered --durations=10"
# What a single test is given before the run says which test hung and
# where, instead of sitting there. Measured rather than picked, over
# repeated runs of the whole suite under `-n auto`: the slowest test
# is tests/functional/p2p/test_download.py::test_download, 9.51s on an
# idle machine, 27.85s on one shared with other work, and 42.09s on
# one loaded past three times its core count. That is the bound that
# matters rather than the spread: a limit anywhere near where the suite
# reports which condition it was waiting on trades a diagnosis for a
# timeout, and this is nearly three times the worst of them while still
# turning the ten-minute hangs of btclib-org/btclib-node#98 into a
# failure that names its test.
#
# It does not bound the deadlines beneath it and is not meant to. A test
# that waits seven times at tests/helpers.py's default could in
# principle ask for more than this, and the run would then be killed by
# this limit rather than by the deadline that was actually missed --
# which loses the condition the test was waiting on. Nothing observed
# comes near it: the longest single wait measured anywhere is 12.60s,
# and the run that failed on a four-core runner reported at 20.24s.
# Issue #46 is where that starvation is tracked.
timeout = 120
filterwarnings = ['ignore:cannot collect test class']

[tool.coverage.run]
# Named, rather than left to `--cov` alone: without it coverage measures
# whatever the run happened to import, so a module no test touches is
# absent from the report instead of appearing in it at zero -- the one
# case the number most needs to show.
source = ["btclib_node", "tests"]
# A guard clause whose branch is never taken reads as fully covered
# under statement coverage: the line ran, and that is all it measures.
# On a node whose defects are mostly in branches not taken, that is the
# wrong thing to count.
branch = true
omit = ["*/site-packages/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
# The tree is there, so this is what holds it: every statement and
# every branch of `btclib_node` and of `tests` is reached by the suite.
# A line that cannot be reached is not covered by lowering this, it is
# covered by deleting the line or by writing the test that reaches it.
fail_under = 100

[tool.ruff]
# target-version is inferred from project.requires-python

[tool.ruff.lint]
# The pair only makes sense together: naming a rule in `ignore` below
# instead of coding it is itself a preview feature, so `preview` is what
# buys `explicit-preview-rules`, which then takes back everything preview
# does *not* name below -- the stable set, plus `unspecified-encoding`
# alone, rather than every rule ruff is still designing.
preview = true
explicit-preview-rules = true
# Deliberately narrower than the standard's own reference selection
# (btclib's), and closer to what black/isort/flake8/autoflake/yesqa/
# pyupgrade/bandit actually checked before this PR: pycodestyle (E/W),
# pyflakes (F, replacing autoflake and most of yesqa), isort (I),
# pyupgrade (UP), bandit (S), plus CPY, new below. Measured with the
# standard's full reference `select` (btclib's own, plus CPY): 245
# findings, 59 fixed by `ruff check --fix` automatically and the other
# 186 spread across ~40 rule families -- flake8-bugbear, pylint,
# tryceratops, eradicate and the rest -- each needing a per-site
# decision (a refactor, a suppression, or a behaviour change) on
# consensus- and network-facing code this PR is not otherwise touching.
# That is a second, larger PR's worth of triage, the same shape as the
# mypy-strict and coverage climbs btclib-org/.github#9 already defers;
# tracked as its own issue rather than rushed through here.
# "D" (pydocstyle) is not selected either, and for the same reason at a
# larger scale: measured, 33 of btclib_node/'s 34 modules carry no
# docstring at all, so turning it on is a documentation pass across the
# whole package. Tracked in the same follow-up.
select = [
    "CPY", # flake8-copyright, replacing the copyright-notice hook below
    "E",   # pycodestyle errors, replacing flake8
    "F",   # pyflakes, replacing autoflake and most of yesqa
    "I",   # isort
    "S",   # flake8-bandit, replacing the two bandit hooks below
    "UP",  # pyupgrade, replacing the pyupgrade hook below
    "W",   # pycodestyle warnings, replacing flake8
]
extend-select = ["unspecified-encoding"]
ignore = [
    # code length is enforced by the formatter, which reflows to its 88
    # columns everything it is allowed to rewrite; max-doc-length below
    # measures the prose the formatter never touches.
    "line-too-long",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"] # re-exported imports
"tests/**" = [
    "S101", # assert
    "S311", # non-cryptographic random: fine in tests
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.flake8-copyright]
# COPYRIGHT is the one place the notice text is written down; this is all
# three of its lines as one regex rather than only the holder line, so a
# file keeping the first and dropping the license lines below it does not
# pass. Anchored with ^: unanchored, CPY001 is a search over the first
# 4096 bytes and not a check that the notice opens the file.
notice-rgx = "^# Copyright \\(c\\) The btclib developers\\n# Distributed under the MIT software license, see the accompanying\\n# LICENSE file or https://opensource\\.org/license/mit for the full text\\."

[tool.codespell]
# "clear" alone, where codespell's default is "clear,rare": measured
# over this tree, "clear" alone already found and fixed every genuine
# typo this repository had, in README.md, a docstring, a comment and a
# handful of identifiers -- so the other three builtins were not tried,
# there being nothing left here for them to add.
builtin = "clear"
# "weigth" in btclib_node/rpc/callbacks.py is a JSON-RPC response key,
# not prose: it is meant to read "weight", matching Bitcoin Core's own
# RPC output, but fixing it changes what an RPC client receives. A
# lint-gate PR is not the place for that change; tracked as its own
# issue, and ignored here rather than silently rewritten by
# --write-changes on some later hook.
ignore-words-list = ["weigth"]
# the vendored vectors are skipped rather than corrected: a test vector
# has to stay byte for byte what upstream published, so a typo inside a
# Bitcoin Core comment is part of the vector -- `unparseable` in
# blockfilters.json is one. tests/_data/README.md pins those files by
# blob sha, and this line is what keeps a spell checker from unpinning
# them. By extension rather than by directory, so that
# tests/_data/README.md itself -- prose *about* the data, not the data
# -- is still spell checked.
skip = "*/_data/*.json,*/_data/*.csv,*/_data/*.txt,*/_data/*.bin"
# a misspelling written on purpose goes in backticks, and that is a rule
# rather than a preference: prose that configures a spell checker has to
# be able to name what it catches, and the comment above costs this hook
# a finding for the one word it is about without it. codespell has no
# per-file configuration, so this holds everywhere it reads; what it
# hides is what is written inside backticks, which is identifiers and
# quoted strings -- typos' half of the work, not this hook's.
ignore-regex = '`[^`]*`'

[tool.typos.files]
# the vendored data [tool.codespell] skips above, for the reason given
# there, and written again rather than shared because the glob syntax
# differs: `*/_data/*.json` matches at any depth for codespell and one
# directory deep for typos. This hook runs with --write-changes, so
# getting it wrong is a rewrite of a pinned vector and not a report.
extend-exclude = [
    "**/_data/*.json",
    "**/_data/*.csv",
    "**/_data/*.txt",
    "**/_data/*.bin",
]

[tool.mypy]
# scripts/ with them: a script that no longer imports is a script
# nobody runs, and it is the one directory here that nothing else
# checks.
files = ["btclib_node", "tests", "scripts"]
# the floor `project.requires-python` declares, and not the interpreter
# that happens to be running: a name added to the standard library
# later passes here and fails for whoever is on the oldest version this
# package says it supports. btclib-org/btclib-node#30 describes the
# floor as 3.10, which is stale -- against 3.10 mypy reports that
# `datetime.UTC` does not exist, and it is right about 3.10.
python_version = "3.14"

# --- the strict bundle, one flag at a time -----------------------------
#
# `strict = true` is fifteen flags and reports 2158 errors here, 596 of
# them one missing annotation each: turning it on wholesale writes a
# backlog into the configuration. Every flag below was measured on its
# own, over the three directories above, and costs nothing today -- so
# each is a ratchet, and the first violation is the one that fails.
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
# the one flag this commit moved out of the backlog below: its single
# finding was the local `NetworkAddress.serialize`, unannotated, and
# that class is btclib's now. Measured at zero with the flag on before
# turning it on.
warn_return_any = true
extra_checks = true
strict_bytes = true
# not in the bundle, and free here: a branch mypy can prove is never
# taken is a branch no test can cover, and this tree is held to
# covering all of them
warn_unreachable = true

# The six left off, each with what it costs today. Five are one job:
# annotate the signatures and they go quiet on their own, which is why
# none is enabled ahead of that pass (btclib-org/btclib-node#104). The
# sixth is not that job: what is left of it belongs to a branch already
# open, and its line says where to read it.
#
#   disallow_untyped_defs      +695   the annotation pass itself
#   disallow_untyped_calls      +45   a typed caller of an untyped callee
#   check_untyped_defs           +3   what #105 came down to once each
#                                     was read, and what is left sits in
#                                     files another pull request holds
#                                     open. #105 enumerates them and
#                                     stays open until the flag goes on
#                                     with that branch, so this line
#                                     does not carry a second copy to
#                                     keep true.
#   no_implicit_reexport        +21   names imported from where they are
#                                     re-exported rather than defined
#   disallow_incomplete_defs    +15   half-annotated signatures

# --- the optional error codes, surveyed one at a time ------------------
#
# Same method: enable, measure, decide. Each reports nothing today.
# `explicit-override` is the one left off, +14, every one of them a
# decorator to add -- the annotation pass again, so it goes with #104.
enable_error_code = [
    "deprecated",
    "ignore-without-code",
    "mutable-override",
    "narrowed-type-not-subtype",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.typos.default.extend-words]
# see [tool.codespell]'s ignore-words-list above: an RPC response key,
# not prose, and fixing it is an API change out of a lint-gate PR's
# scope. typos' --write-changes would otherwise rewrite it silently.
weigth = "weigth"
# ruff's copyright rule, not the misspelling of COPY or CPU that typos'
# dictionary offers -- .pre-commit-config.yaml names it in a comment.
CPY = "CPY"
